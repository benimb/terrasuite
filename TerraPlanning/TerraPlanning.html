<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>TerraPlanning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Atelier de planification : barre d'outils dense en haut, plan de travail en dessous, feuilles imprimées blanches posées sur une table grise */
:root{
  --bg:#EEF0EF; --panel:#FFFFFF; --sunk:#F6F7F6; --ink:#1C2326; --muted:#5F6B6E; --line:#D5DAD9; --line2:#E6E9E8;
  --accent:#24546E; --accent-ink:#FFFFFF; --accent-soft:#DCE8EE; --sel:#E5EFF4;
  --warn:#9A5B00; --warn-bg:#FFF4DF; --err:#B3261E; --ok:#2E6B3F;
  --bar:#4F6D8A; --crit:#C0392B; --sum:#1E2328; --closed:#E3E6E5; --grid:#E3E6E5; --grid2:#C9CFCE; --link:#56616A;
  --table:#E2E5E4;
  --f-ui:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-cond:"IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
  --rh:28px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141819; --panel:#1C2123; --sunk:#181D1F; --ink:#E2E7E6; --muted:#97A3A2; --line:#323B3D; --line2:#283032;
  --accent:#7DB4CF; --accent-ink:#0E1A20; --accent-soft:#1F3540; --sel:#1F3038;
  --warn:#E2B15A; --warn-bg:#2E2512; --err:#F08A80; --ok:#7CC48F;
  --bar:#7F9DBA; --crit:#E0705F; --sum:#D5DBDA; --closed:#252C2E; --grid:#252C2E; --grid2:#394345; --link:#8D99A1;
  --table:#0F1213; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141819; --panel:#1C2123; --sunk:#181D1F; --ink:#E2E7E6; --muted:#97A3A2; --line:#323B3D; --line2:#283032;
  --accent:#7DB4CF; --accent-ink:#0E1A20; --accent-soft:#1F3540; --sel:#1F3038;
  --warn:#E2B15A; --warn-bg:#2E2512; --err:#F08A80; --ok:#7CC48F;
  --bar:#7F9DBA; --crit:#E0705F; --sum:#D5DBDA; --closed:#252C2E; --grid:#252C2E; --grid2:#394345; --link:#8D99A1;
  --table:#0F1213; color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px;line-height:1.4}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%;min-height:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-cond);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.ver{font-family:var(--f-mono);font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 7px;letter-spacing:0;text-transform:none;font-weight:400}
.brand small{font-family:var(--f-ui);font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);font-size:12px}
.projsel{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 260px}
.projsel select{min-width:0;flex:1;max-width:420px}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.status.ok{color:var(--ok)} .status.err{color:var(--err)}
.tabs{display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:2px}
.tabs button{border:0;background:transparent;padding:5px 12px;border-radius:5px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--grid2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.45;cursor:default}
.btn.icon{padding:5px 8px;min-width:30px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 7px;min-width:0}
textarea{width:100%;resize:vertical}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--sunk)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.toolbar .grow{flex:1}
.msg{margin:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));padding:7px 10px;border-radius:6px;background:var(--warn-bg);color:var(--warn);font-size:12.5px}
/* ---- Saisie ---- */
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}
.scroller{overflow:auto;min-height:0;position:relative;background:var(--panel)}
.grid{display:grid;grid-template-columns:var(--tw) var(--gw);width:max-content}
.th,.gh{position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--line);height:46px}
.th{left:0;z-index:4;display:flex;border-right:1px solid var(--line)}
.th div{display:flex;align-items:flex-end;padding:0 6px 6px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;border-right:1px solid var(--line2)}
.tb{position:sticky;left:0;z-index:2;background:var(--panel);border-right:1px solid var(--line)}
.tr{display:flex;height:var(--rh);border-bottom:1px solid var(--line2)}
.tr.sel{background:var(--sel)}
.tr .c{border-right:1px solid var(--line2);display:flex;align-items:center;min-width:0;overflow:hidden}
.tr .c input{border:0;background:transparent;width:100%;height:100%;padding:0 6px;border-radius:0}
.tr .c input:focus{background:var(--panel);box-shadow:inset 0 0 0 2px var(--accent)}
.tr .c input[readonly]{color:var(--muted)}
.tr .c.num{font-family:var(--f-mono);font-size:12px;justify-content:flex-end;padding-right:6px;color:var(--muted);cursor:pointer;user-select:none}
.tr .c.mono input,.tr .c.ro{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.tr .c.ro{padding:0 6px;color:var(--muted)}
.tr.sum .c.nm input{font-weight:600}
.tr.blank .c.nm{color:var(--muted)}
.tr.rorow .c.nm input,.tr.rorow .c input{color:var(--muted)}
.tr.rorow.sum .c.nm input{color:var(--ink)}
.tw{border:0;background:transparent;width:18px;flex:0 0 18px;padding:0;cursor:pointer;color:var(--muted);font-size:10px}
.tw.none{visibility:hidden}
.pin{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:5px}
.gb svg,.gh svg{display:block}
.th div{position:relative}
.rz{position:absolute;right:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:5}
.rz:hover{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.grid.dense .tr .c input,.grid.dense .tr .c.ro,.grid.dense .tr .c.num{font-size:12px}
.zoombar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.zoombar input[type=range]{width:150px;accent-color:var(--accent)}
.zoombar .hint{min-width:118px;font-variant-numeric:tabular-nums}
.lk{display:grid;grid-template-columns:50px 1fr 64px 30px;gap:4px;align-items:center}
.lk input,.lk select{width:100%;font-size:12px;padding:3px 5px}
.lkname{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin:-2px 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lkhead{display:grid;grid-template-columns:50px 1fr 64px 30px;gap:4px;font-size:11px;color:var(--muted)}
.succ{margin:0;padding-left:16px;font-size:12px;display:flex;flex-direction:column;gap:2px}
.newp{max-width:860px;margin:0 auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;overflow:auto}
.newp h2{margin:0;font-family:var(--f-cond);font-weight:600;font-size:20px}
.tpls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tpl{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:14px;cursor:pointer}
.tpl:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tpl b{display:block;margin-bottom:4px}
.tpl span{font-size:12.5px;color:var(--muted)}
.side{border-left:1px solid var(--line);background:var(--sunk);overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.side h3{margin:0;font-family:var(--f-cond);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>label,.lbl{font-size:11.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);font-size:12px}
.tag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11.5px;font-weight:500}
.tag.crit{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.tag.free{background:var(--accent-soft);color:var(--accent)}
.empty{margin:auto;max-width:440px;text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{margin:0;font-family:var(--f-cond);font-weight:600;font-size:20px;text-wrap:balance}
.empty p{margin:0;color:var(--muted)}
/* ---- Mise en page ---- */
.print{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr)}
.pset{overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:4px 0 24px}
.pset details{border-bottom:1px solid var(--line2)}
.pset summary{cursor:pointer;padding:11px 16px;font-family:var(--f-cond);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between}
.pset summary::after{content:"+";color:var(--muted);font-family:var(--f-mono)}
.pset details[open] summary::after{content:"–"}
.pset .body{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;white-space:nowrap;border:0;background:var(--panel);padding:5px 6px;cursor:pointer;border-right:1px solid var(--line);font-size:12px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.colrow{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center}
.colrow input[type=number]{width:100%}
.hint{font-size:11.5px;color:var(--muted)}
.preview{overflow:auto;min-height:0;background:var(--table);padding:18px max(16px,env(safe-area-inset-right,0px)) 40px 18px}
.pinfo{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:0 auto 14px;font-size:12.5px;color:var(--muted)}
.pinfo b{color:var(--ink);font-weight:600}
.pinfo .grow{flex:1}
.sheets{display:flex;flex-direction:column;align-items:center;gap:18px}
.sheet{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18),0 8px 24px rgba(0,0,0,.10);max-width:100%;position:relative}
.sheet svg{display:block;width:100%;height:auto}
.sheet .pn{position:absolute;left:0;top:-16px;font-size:11px;color:var(--muted)}
/* ---- Projet ---- */
.proj{overflow:auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.proj .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;max-width:1100px}
.proj .lotscard{grid-column:span 2}@media (max-width:700px){.proj .lotscard{grid-column:auto}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{margin:0;font-family:var(--f-cond);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:5px;padding:3px 7px;font-size:12px}
.exc{width:100%;border-collapse:collapse;font-size:12.5px}
.exc td,.exc th{border-bottom:1px solid var(--line2);padding:4px 4px;text-align:left}
.exc th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.exc input{width:100%}
.excwrap{overflow:auto;max-height:340px}
.expwrap{position:relative}
.menu{position:absolute;top:calc(100% + 4px);left:0;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px;width:310px;max-width:calc(100vw - 32px);display:flex;flex-direction:column}
.menu button{border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:5px;cursor:pointer;line-height:1.35}
.menu button:hover,.menu button:focus-visible{background:var(--sel)}
.menu button span{display:block;font-size:11.5px;color:var(--muted)}
.bar .hit{cursor:grab}.bar .hz{cursor:ew-resize}.bar .ld{cursor:crosshair;opacity:0;transition:opacity .12s}.bar:hover .ld{opacity:1}
.dragtip{position:fixed;z-index:50;background:var(--ink);color:var(--panel);font-size:12px;padding:3px 8px;border-radius:5px;pointer-events:none;font-variant-numeric:tabular-nums}
#blQuick{max-width:220px}
.filters{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.filters input[type=search]{width:200px}
.filters select{max-width:200px}
.tr .c.ro.done{color:var(--ok)}
.tr .c.ro.act{color:var(--accent)}
.imp th{vertical-align:top;min-width:120px}
.imp select{width:100%;margin-top:4px;text-transform:none;letter-spacing:0;font-weight:400}
.imp td{white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
#btnMenu{display:none}
.tabs .sm{display:none}
.bar .hit,.bar .hz,.bar .ld{touch-action:none}
@media (hover: none){ .bar .ld{opacity:0} .bar.selbar .ld{opacity:1} }
.consult{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--panel)}
.cbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.ctitle{display:flex;flex-direction:column;min-width:0}
.ctitle b{font-family:var(--f-cond);font-size:17px;font-weight:600}
.cbtn{display:flex;gap:6px;flex-wrap:wrap}
.cscroll{flex:1;touch-action:pan-x pan-y}
.cscroll .grid > div:nth-child(1),.cscroll .grid > div:nth-child(3){display:none}
.cscroll .grid{grid-template-columns:var(--gw)}
.cscroll .bar{cursor:pointer}
.cinfo{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px 44px 12px 14px;display:flex;flex-direction:column;gap:3px}
.cinfo .cx{position:absolute;top:8px;right:8px}
@media (max-width: 700px){
  #btnMenu{display:inline-flex;order:-1}
  .top{gap:8px}
  .brand small{display:none}
  .projsel{flex:1 1 140px}
  .projsel .lbl{display:none}
  .topacts{display:none!important}
  #app.menuopen .topacts{display:flex!important;flex-basis:100%}
  .tabs{flex-basis:100%;overflow-x:auto}
  .tabs button{padding:5px 9px}
  .tabs .lg{display:none}.tabs .sm{display:inline}
  .status{flex-basis:100%;font-size:11.5px}
  .mtools{gap:5px}
  .narrow .th > div:not(:nth-child(-n+2)){display:none}
  .narrow .tr .c:not(.num):not(.nm){display:none}
  .narrow .tr.blank .c.nm{width:auto!important}
  .work{grid-template-rows:62vh auto}
  .filters input[type=search]{width:100%}
}
@media (max-width: 900px){
  #app{height:auto;min-height:100%}
  .view{flex:none}
  .work{grid-template-columns:1fr;grid-template-rows:70vh auto}
  .side{border-left:0;border-top:1px solid var(--line)}
  .preview{min-height:70vh}
  .print{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .pset{max-height:45vh;border-right:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<div id="app">
  <header class="top">
    <a class="btn" href="../terrasuite.html" style="text-decoration:none;color:inherit" id="homeLink">← TerraSuite</a>
    <div class="brand">TerraPlanning <span class="ver" title="Version bêta">v0.14 bêta</span><small>Plannings de projet</small></div>
    <button class="btn icon" id="btnMenu" aria-label="Menu">☰</button>
    <div class="projsel"><label for="projSel" class="lbl">Planning</label><select id="projSel"></select></div>
    <div class="topacts" style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn" id="btnNew">Nouveau</button>
      <button class="btn" id="btnImport">Importer</button>
      <div class="expwrap"><button class="btn" id="btnExportJson" aria-haspopup="true">Exporter ▾</button>
        <div class="menu" id="expMenu" hidden role="menu">
          <button data-exp="xml" role="menuitem"><b>MS Project XML</b> (.xml)<span>MS Project 2003 à 365, ProjectLibre, OmniPlan, Merlin</span></button>
          <button data-exp="mpx" role="menuitem"><b>MPX</b> (.mpx)<span>MS Project 98 et 2000</span></button>
          <button data-exp="gan" role="menuitem"><b>GanttProject</b> (.gan)<span>GanttProject</span></button>
          <button data-exp="csv" role="menuitem"><b>Tableau CSV</b> (.csv)<span>Excel, Smartsheet, TeamGantt, Monday, Asana</span></button>
          <button data-exp="pdf" role="menuitem"><b>PDF</b><span>Depuis l'onglet Mise en page</span></button>
          <button data-exp="json" role="menuitem"><b>Sauvegarde complète</b> (.json)<span>Cette application, avec la mise en page</span></button>
        </div></div>
      <button class="btn" id="btnDup">Dupliquer</button>
      <button class="btn danger" id="btnDel">Supprimer</button>
    </div>
    <nav class="tabs" role="tablist" aria-label="Vues">
      <button role="tab" data-tab="home" aria-selected="false">Accueil</button>
      <button role="tab" data-tab="edit" aria-selected="true">Saisie</button>
      <button role="tab" data-tab="view" aria-selected="false">Consultation</button>
      <button role="tab" data-tab="print" aria-selected="false">Mise en page</button>
      <button role="tab" data-tab="proj" aria-selected="false"><span class="lg">Projet et calendrier</span><span class="sm">Projet</span></button>
    </nav>
    <span class="status" id="status" role="status"></span>
  </header>
  <main class="view" id="view"></main>
  <div id="dragTip" class="dragtip" hidden></div>
  <input type="file" id="fileIn" accept=".json,.xml,.mpx,.gan,.mpp,.csv,.tsv,.txt,.md,.xlsx,.xls,.ods,application/json,text/xml" hidden>
  <input type="file" id="logoIn" accept="image/png,image/jpeg" hidden>
  <script src="../TerraChantier/projets-api.js" onerror="this.remove()"></script>
  <script src="../TerraChantier/terrasuite-compte.js" onerror="this.remove()"></script>
  <input type="file" id="carnetIn" accept=".json,application/json" hidden>
  <input type="file" id="lotsIn" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.3/dist/svg2pdf.umd.min.js"></script>
<script>
/* Moteur de planification : calendrier ouvré, liens FD/DD/FF/DF avec décalage, durées écoulées, contraintes, récapitulatifs, chemin critique.
   Temps = jours depuis 1970-01-01 (UTC, flottant). */
const Engine = (() => {
  const MSD = 86400000, EPS = 1e-7;
  function parseDT(s) {
    if (!s) return null;
    const [d, t = '00:00'] = String(s).split('T');
    const [y, m, dd] = d.split('-').map(Number);
    const [h, mi] = t.split(':').map(Number);
    return Date.UTC(y, m - 1, dd) / MSD + ((h || 0) + (mi || 0) / 60) / 24;
  }
  function dayStr(D) { return new Date(Math.floor(D + EPS) * MSD).toISOString().slice(0, 10); }
  function fmtDT(x) {
    if (x == null || !isFinite(x)) return null;
    let D = Math.floor(x + EPS), mins = Math.round((x - D) * 1440);
    if (mins >= 1440) { D++; mins -= 1440; }
    return dayStr(D) + 'T' + String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
  }
  function hm(s) { const [h, m] = s.split(':').map(Number); return h + (m || 0) / 60; }

  function makeCal(cal, hoursPerDay) {
    cal = cal || {};
    const hours = cal.hours && cal.hours.length ? cal.hours : [['09:00', '12:00'], ['14:00', '18:00']];
    const IV = hours.map(([a, b]) => [hm(a) / 24, hm(b) / 24]).filter(([a, b]) => b > a).sort((x, y) => x[0] - y[0]);
    const s = IV[0][0], e = IV[IV.length - 1][1];
    const tot = IV.reduce((acc, [a, b]) => acc + b - a, 0);
    const wd = new Set(cal.workdays || [1, 2, 3, 4, 5]);
    const ex = new Set(), wex = new Set();
    for (const x of cal.exceptions || []) {
      const a = Math.floor(parseDT(x.from)), b = Math.floor(parseDT(x.to || x.from));
      for (let D = a; D <= b && D - a < 4000; D++) (x.working ? wex : ex).add(D);
    }
    const hpd = hoursPerDay || 7;
    const isWork = D => wex.has(D) ? true : ex.has(D) ? false : wd.has(((D % 7) + 7 + 4) % 7);

    function off2f(off) { let acc = 0; for (const [a, b] of IV) { if (off <= a) break; acc += Math.min(off, b) - a; } return acc / tot; }
    function f2offEnd(f) { let need = f * tot; for (const [a, b] of IV) { if (need <= b - a + EPS) return a + need; need -= b - a; } return e; }
    function f2offStart(f) { let need = f * tot; for (const [a, b] of IV) { if (need < b - a - EPS) return a + need; need -= b - a; } return e; }
    function nextStart(t) {
      if (!isFinite(t)) return t;
      let D = Math.floor(t + EPS), off = t - D;
      if (isWork(D)) for (const [a, b] of IV) if (off < b - EPS) return D + Math.max(off, a);
      D++; let g = 0; while (!isWork(D) && g++ < 4000) D++;
      return D + s;
    }
    function prevEnd(t) {
      if (!isFinite(t)) return t;
      let D = Math.floor(t - EPS), off = t - D;
      if (isWork(D)) for (let k = IV.length - 1; k >= 0; k--) { const [a, b] = IV[k]; if (off > a + EPS) return D + Math.min(off, b); }
      D--; let g = 0; while (!isWork(D) && g++ < 4000) D--;
      return D + e;
    }
    function add(t, n) {
      if (!(n > EPS) || !isFinite(t)) return t;
      t = nextStart(t);
      for (let g = 0; g < 20000; g++) {
        const D = Math.floor(t + EPS), f0 = off2f(t - D), rem = 1 - f0;
        if (n <= rem + EPS) return D + f2offEnd(f0 + n);
        n -= rem; t = nextStart(D + e);
      }
      return t;
    }
    function sub(t, n) {
      if (!(n > EPS) || !isFinite(t)) return t;
      t = prevEnd(t);
      for (let g = 0; g < 20000; g++) {
        const D = Math.floor(t - EPS), av = off2f(t - D);
        if (n <= av + EPS) return D + f2offStart(Math.max(0, av - n));
        n -= av; t = prevEnd(D + s);
      }
      return t;
    }
    function between(a, b) {
      if (!isFinite(a) || !isFinite(b)) return 0;
      if (b < a) return -between(b, a);
      let acc = 0;
      for (let D = Math.floor(a); D <= Math.floor(b); D++) {
        if (!isWork(D)) continue;
        for (const [x, y] of IV) { const lo = Math.max(a, D + x), hi = Math.min(b, D + y); if (hi > lo) acc += hi - lo; }
      }
      return acc / tot;
    }
    const len = e - s;
    const WF = { d: 1, w: 5, mo: 20, h: 1 / hpd, min: 1 / (hpd * 60) };
    const EF = { d: 1, w: 7, mo: 30, h: 1 / 24, min: 1 / 1440 };
    function lag(t, l, sign = 1) {
      if (!l || !l.v) return t;
      const v = l.v * sign;
      if (l.e) return t + v * (EF[l.u] || 1);
      const n = v * (WF[l.u] || 1);
      return n >= 0 ? add(t, n) : sub(t, -n);
    }
    function workDays(d) { return d && !d.e ? d.v * (WF[d.u] || 1) : 0; }
    function fwd(start, d) {
      if (!d || !d.v) return start;
      if (d.e) return start + d.v * (EF[d.u] || 1);
      return add(start, workDays(d));
    }
    function back(fin, d) {
      if (!d || !d.v) return fin;
      if (d.e) return fin - d.v * (EF[d.u] || 1);
      return sub(fin, workDays(d));
    }
    return { s, e, len, isWork, isClosed, nextStart, prevEnd, add, sub, between, lag, fwd, back, workDays, WF, EF, hpd };
  }

  /* Structure : niveaux → parents / récapitulatifs, numéros de ligne (ID MS) */
  function structure(tasks) {
    const stack = [], info = new Map();
    tasks.forEach((t, i) => {
      if (t.blank) return;
      while (stack.length && stack[stack.length - 1].level >= t.level) stack.pop();
      const parent = stack.length ? stack[stack.length - 1] : null;
      info.set(t.uid, { id: i + 1, parent: parent ? parent.uid : null, children: [], summary: false, depth: stack.length });
      if (parent) { const p = info.get(parent.uid); p.children.push(t.uid); p.summary = true; }
      stack.push(t);
    });
    return info;
  }

  /* Frise chronologique : chaque ligne a ses dates, pas de liens ni de calendrier ouvré */
  function scheduleFrise(P) {
    const tasks = P.tasks || [], cal = makeCal(P.calendar, P.hoursPerDay), info = structure(tasks), out = new Map();
    const today = Math.floor(Date.now() / MSD);
    for (const t of tasks) {
      if (t.blank) continue;
      const inf = info.get(t.uid); if (inf.summary) continue;
      let a = parseDT(t.start), b = parseDT(t.end || t.start);
      if (a == null) a = b; if (a == null) a = b = today;
      a = Math.floor(a); b = Math.floor(b); if (b < a) [a, b] = [b, a];
      const es = t.ms ? a + 0.5 : a, ef = t.ms ? a + 0.5 : b + 1 - 1e-6;
      out.set(t.uid, { id: inf.id, parent: inf.parent, summary: false, depth: inf.depth, children: [], es, ef, ls: es, lf: ef, float: 0, critical: false });
    }
    for (let i = tasks.length - 1; i >= 0; i--) {
      const t = tasks[i]; if (t.blank) continue;
      const inf = info.get(t.uid); if (!inf.summary) continue;
      let a = Infinity, b = -Infinity;
      for (const c of inf.children) { const r = out.get(c); if (r) { a = Math.min(a, r.es); b = Math.max(b, r.ef); } }
      if (!isFinite(a)) { a = today; b = today + 1 - 1e-6; }
      out.set(t.uid, { id: inf.id, parent: inf.parent, summary: true, depth: inf.depth, children: inf.children, es: a, ef: b, ls: a, lf: b, float: 0, critical: false });
    }
    const vals = [...out.values()];
    return { R: out, cal, errors: [], start: Math.min(...vals.map(r => r.es)), finish: Math.max(...vals.map(r => r.ef)), info, frise: true };
  }
  function schedule(project) {
    if (project.kind === 'frise') return scheduleFrise(project);
    const tasks = project.tasks || [];
    const cal = makeCal(project.calendar, project.hoursPerDay);
    const info = structure(tasks);
    const byUid = new Map(tasks.filter(t => !t.blank).map(t => [t.uid, t]));
    const projStart = parseDT(project.start) ?? Math.floor(Date.now() / MSD) + cal.s;
    const errors = [];
    // successeurs
    const succs = new Map([...byUid.keys()].map(u => [u, []]));

        succs.get(p.uid).push({ uid: t.uid, type: p.type, lag: p.lag });

    }

    const deps = new Map();
    const endNode = u => 't' + u;
    for (const [u, t] of byUid) {

      const hd = [], keep = [];

        while (c != null) { if (c === u) bad = true; c = info.get(c).parent; }

        hd.push(endNode(p.uid)); keep.push(p);
      }
      t.preds = keep;
      if (inf.parent != null) hd.push('h' + inf.parent);
      deps.set('h' + u, hd);
      deps.set('t' + u, inf.summary ? inf.children.map(endNode) : ['h' + u]);
    }
    for (const v of succs.values()) v.length = 0;
    for (const t of byUid.values()) for (const p of t.preds) succs.get(p.uid).push({ uid: t.uid, type: p.type, lag: p.lag });
    const order = [], state = new Map();
    function visit(n, path) {
      const st = state.get(n);
      if (st === 2) return;
      if (st === 1) { throw new Error('cycle'); }
      state.set(n, 1);
      for (const d of deps.get(n) || []) visit(d, path);
      state.set(n, 2); order.push(n);
    }
    const cyc = new Set();
    for (const n of deps.keys()) {
      try { visit(n); } catch (e) {
        cyc.add(n.slice(1)); state.set(n, 2);
        for (const [k, v] of state) if (v === 1) state.set(k, 0);
      }
    }
    if (cyc.size) {
      // casser les cycles : retirer les liens des tâches concernées et recommencer
      const ids = [...cyc].map(u => info.get(+u)?.id).filter(Boolean);
      errors.push('Liens circulaires détectés autour des lignes ' + ids.join(', ') + ' : liens ignorés');
      const p2 = JSON.parse(JSON.stringify(project));
      p2.tasks.forEach(t => { if (cyc.has(String(t.uid))) t.preds = []; });
      const r = schedule(p2); r.errors = errors.concat(r.errors); return r;
    }
    const R = new Map(); // uid → {es, ef, floor}
    for (const u of byUid.keys()) R.set(u, {});
    for (const n of order) {
      const u = +n.slice(1), t = byUid.get(u), inf = info.get(u), r = R.get(u);
      if (n[0] === 'h') {
        let sReq = inf.parent != null ? R.get(inf.parent).floor : -Infinity, fReq = -Infinity, forceS = null, forceF = null;
        for (const p of t.preds) {
          const pr = R.get(p.uid);
          if (p.type === 'FS') sReq = Math.max(sReq, cal.lag(pr.ef, p.lag));
          else if (p.type === 'SS') sReq = Math.max(sReq, cal.lag(pr.es, p.lag));
          else if (p.type === 'FF') fReq = Math.max(fReq, cal.lag(pr.ef, p.lag));
          else if (p.type === 'SF') fReq = Math.max(fReq, cal.lag(pr.es, p.lag));
        }
        const c = t.cons, cd = c && parseDT(c.date);
        if (c && cd != null) {
          if (c.type === 'SNET') sReq = Math.max(sReq, cd);
          else if (c.type === 'FNET') fReq = Math.max(fReq, cd);
          else if (c.type === 'MSO') forceS = cd;
          else if (c.type === 'MFO') forceF = cd;
        }
        r.floor = forceS ?? sReq;
        // date de début du projet : plancher des tâches sans contrainte de date (une contrainte peut la précéder, comme dans MS Project)
        if (!(c && cd != null && ['SNET', 'FNET', 'MSO', 'MFO'].includes(c.type)) && !t.preds.length) sReq = Math.max(sReq, projStart);
        if (!inf.summary) {
          const d = t.ms ? { v: 0, u: 'd' } : t.dur;
          const work = d && d.v && !d.e;
          let st, fi;
          if (!d || !d.v) {
            st = fi = forceF ?? forceS ?? Math.max(sReq, fReq);
          } else if (forceF != null) {
            fi = work ? cal.prevEnd(forceF) : forceF; st = cal.back(fi, d);
          } else {
            st = forceS ?? sReq; if (work) st = cal.nextStart(st);
            fi = cal.fwd(st, d);
            if (forceS == null && fReq > fi + EPS) { fi = fReq; st = cal.back(fi, d); }
          }
          r.es = st; r.ef = fi;
          // dates réelles saisies : elles remplacent le calcul
          if (t.aStart || t.aFinish) {
            const as = t.aStart ? parseDT(String(t.aStart).slice(0, 10)) : null, af = t.aFinish ? parseDT(String(t.aFinish).slice(0, 10)) : null;
            if (as != null) { let s0 = as + cal.s; if (work) s0 = cal.nextStart(s0); r.es = s0; r.ef = af != null ? Math.max(s0, af + cal.e) : (d && d.v ? cal.fwd(s0, d) : s0); }
            else if (af != null) { r.ef = af + cal.e; r.es = d && d.v ? cal.back(r.ef, d) : r.ef; }
            if (!d || !d.v) r.ef = r.es;
            r.actual = true;
          }
        }
      } else if (inf.summary) {
        let a = Infinity, b = -Infinity;
        for (const c of inf.children) { a = Math.min(a, R.get(c).es); b = Math.max(b, R.get(c).ef); }
        r.es = a; r.ef = b;
      }
    }
    // passe arrière
    let PF = -Infinity;
    for (const r of R.values()) if (isFinite(r.ef)) PF = Math.max(PF, r.ef);
    for (let i = order.length - 1; i >= 0; i--) {
      const n = order[i], u = +n.slice(1), t = byUid.get(u), inf = info.get(u), r = R.get(u);
      const d = t.ms || inf.summary ? null : t.dur;
      if (n[0] === 't') {
        let lf = inf.parent != null ? R.get(inf.parent).ceil : PF;
        for (const s of succs.get(u)) {
          const sr = R.get(s.uid), sd = byUid.get(s.uid).dur;
          if (s.type === 'FS') lf = Math.min(lf, cal.lag(sr.ls, s.lag, -1));
          else if (s.type === 'FF') lf = Math.min(lf, cal.lag(sr.lf, s.lag, -1));
          else if (s.type === 'SS') lf = Math.min(lf, cal.fwd(cal.lag(sr.ls, s.lag, -1), d || { v: 0 }));
          else if (s.type === 'SF') lf = Math.min(lf, cal.fwd(cal.lag(sr.lf, s.lag, -1), d || { v: 0 }));
        }
        r.ceil = lf;
        if (!inf.summary) { r.lf = lf; r.ls = cal.back(lf, d || { v: 0 }); }
      } else if (inf.summary) {
        let a = Infinity; for (const c of inf.children) a = Math.min(a, R.get(c).ls); r.ls = a; r.lf = r.ceil;
      }
    }
    const out = new Map();
    for (const [u, t] of byUid) {
      const r = R.get(u), inf = info.get(u);
      const fl = cal.between(r.ef, r.lf);
      out.set(u, { id: inf.id, parent: inf.parent, summary: inf.summary, depth: inf.depth, children: inf.children,
        es: r.es, ef: r.ef, ls: r.ls, lf: r.lf, float: fl, critical: fl < 0.01, actual: !!r.actual, done: !!t.aFinish });
    }
    return { R: out, cal, errors, start: Math.min(...[...R.values()].map(r => r.es).filter(isFinite)), finish: PF, info };
  }

  /* Durées : texte ↔ objet. Unités françaises de MS Project : j, sem, ms (mois), h ; écoulé : jé, semé, msé */
  const UL = { d: 'j', w: 'sem', mo: 'mois', h: 'h', min: 'min' };
  function fmtNum(v) { return (Math.round(v * 100) / 100).toString().replace('.', ','); }
  function durText(d) { if (!d) return '0 j'; return fmtNum(d.v) + ' ' + UL[d.u] + (d.e ? 'é' : ''); }
  function lagText(l) { if (!l || !l.v) return ''; return (l.v > 0 ? '+' : '-') + fmtNum(Math.abs(l.v)) + ' ' + UL[l.u] + (l.e ? 'é' : ''); }
  function parseDur(txt, def = 'd') {
    if (txt == null) return null;
    let s = String(txt).trim().toLowerCase().replace(',', '.').replace(/\s+/g, '');
    const m = s.match(/^([+-]?\d*\.?\d+)([a-zéèû.]*)\??$/);
    if (!m) return null;
    let v = parseFloat(m[1]), u = m[2].replace(/\./g, ''), e = false;
    if (/(é|e|c|cal|ec|ed|ew|emo|eh)$/.test(u) && !/^(sem|se|semaine|semaines|s|j|jour|jours|d|day|days|w|wk|wks|mo|mois|ms|h|min|heure|heures)$/.test(u)) {
      e = true; u = u.replace(/^(e)(?=[a-z])/, '').replace(/(écoulés?|é|cal|c|e)$/, '');
    }
    const map = { '': def, j: 'd', jr: 'd', jour: 'd', jours: 'd', d: 'd', day: 'd', days: 'd', s: 'w', sem: 'w', semaine: 'w', semaines: 'w', se: 'w', w: 'w', wk: 'w', mo: 'mo', mois: 'mo', ms: 'mo', mon: 'mo', h: 'h', hr: 'h', heure: 'h', heures: 'h', min: 'min', mn: 'min' };
    if (!(u in map)) return null;
    return { v, u: map[u], e };
  }
  const TYPE_FR = { FS: 'FD', SS: 'DD', FF: 'FF', SF: 'DF' }, TYPE_IN = { FD: 'FS', DD: 'SS', FF: 'FF', DF: 'SF', FS: 'FS', SS: 'SS', SF: 'SF' };
  function predsText(t, idOf) {
    return (t.preds || []).map(p => {
      const id = idOf(p.uid); if (id == null) return '';
      const l = lagText(p.lag);
      return id + (p.type !== 'FS' || l ? TYPE_FR[p.type] : '') + (l ? l.replace(' ', '') : '');
    }).filter(Boolean).join(';');
  }
  function parsePreds(txt, uidOf) {
    const out = [], bad = [];
    for (let part of String(txt || '').split(/[;,]/)) {
      part = part.trim().toUpperCase(); if (!part) continue;
      const m = part.match(/^(\d+)\s*(FD|DD|FF|DF|FS|SS|SF)?\s*(?:([+-])\s*(.+))?$/);
      if (!m) { bad.push(part); continue; }
      const uid = uidOf(+m[1]); if (uid == null) { bad.push(part); continue; }
      let lag = { v: 0, u: 'd', e: false };
      if (m[3]) { const d = parseDur(m[4].toLowerCase()); if (!d) { bad.push(part); continue; } d.v *= m[3] === '-' ? -1 : 1; lag = d; }
      out.push({ uid, type: TYPE_IN[m[2] || 'FD'], lag });
    }
    return { preds: out, bad };
  }
  return { parseDT, fmtDT, dayStr, makeCal, schedule, structure, durText, parseDur, predsText, parsePreds, fmtNum };
})();


/* Mise en page imprimée : construit des feuilles SVG en millimètres, identiques à l'écran et dans le PDF */
const Time = (() => {
  const MSD = 86400000;
  const MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const MON3 = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  const DOW = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];
  const day = (y, m, d) => Date.UTC(y, m, d) / MSD;
  const ymd = D => { const x = new Date(Math.floor(D) * MSD); return [x.getUTCFullYear(), x.getUTCMonth(), x.getUTCDate()]; };
  const wday = D => ((Math.floor(D) % 7) + 7 + 4) % 7;
  const monday = D => Math.floor(D) - ((wday(D) + 6) % 7);
  const pad = n => String(n).padStart(2, '0');
  function isoWeek(D) { const t = Math.floor(D) - ((wday(D) + 6) % 7) + 3; const [y] = ymd(t); return 1 + Math.floor((t - day(y, 0, 1)) / 7); }
  function start(unit, D) {
    const [y, m] = ymd(D);
    if (unit === 'day') return Math.floor(D);
    if (unit === 'week') return monday(D);
    if (unit === 'month') return day(y, m, 1);
    if (unit === 'quarter') return day(y, m - (m % 3), 1);
    if (unit === 'decade') return day(y - (((y % 10) + 10) % 10), 0, 1);
    if (unit === 'century') return day(y - (((y % 100) + 100) % 100), 0, 1);
    return day(y, 0, 1);
  }
  function next(unit, D) {
    const [y, m] = ymd(D);
    if (unit === 'day') return D + 1;
    if (unit === 'week') return D + 7;
    if (unit === 'month') return day(y, m + 1, 1);
    if (unit === 'quarter') return day(y, m + 3, 1);
    if (unit === 'decade') return day(y + 10, 0, 1);
    if (unit === 'century') return day(y + 100, 0, 1);
    return day(y + 1, 0, 1);
  }

      for (const t of Time.ticks(U1, Math.floor(tA), Math.ceil(tB))) o.push(line(X(t.s), bodyY, X(t.s), bodyY + Hb, C.grid2, 0.15));
    }
    // en-tête de l'échelle de temps
    for (const [unit, yy] of [[U1, oy], [U2, oy + tierH]]) {
      const tk = Time.ticks(unit, Math.floor(tA) - 400, Math.ceil(tB) + 1).filter(t => !(t.n < tA || t.s > tB));
      const tsz = unit === U1 ? fs * 1.02 : fs * 0.92;
      // même format de libellé pour toute la graduation
      let common = 0;
      const full = tk.filter(t => X(t.s) >= gx - 0.01 && X(t.n) <= gx + sl.w + 0.01);
      if (full.length) { const nL = Time.labels(unit, full[0].s, L.weekLabel).length; while (common < nL - 1 && full.some(t => tw(Time.labels(unit, t.s, L.weekLabel)[common], tsz, unit === U1) > (X(t.n) - X(t.s)) - 1.2)) common++; }
      for (const t of tk) {
        const x1 = X(t.s), x2 = X(t.n), vis1 = Math.max(x1, gx), vis2 = Math.min(x2, gx + sl.w), w = vis2 - vis1;
        o.push(line(x1, yy, x1, yy + tierH, C.line, 0.12));
        const lab = Time.labels(unit, t.s, L.weekLabel).slice(common).find(l => tw(l, tsz, unit === U1) <= w - 1.2);
        if (lab) {
          const cx = unit === U1 ? vis1 + 1 : (x1 + x2) / 2;
          const inside = unit === U1 || (x1 >= gx - 0.01 && x2 <= gx + sl.w + 0.01);
          o.push(txt(inside ? cx : (vis1 + vis2) / 2, yy + tierH / 2 + tsz * 0.36, lab, tsz, { anchor: unit === U1 ? 'start' : 'middle', bold: unit === U1 }));
        }
      }
    }
    // ligne d'état
    let statusT = null;
    if (L.statusLine === 'today') statusT = Date.now() / Time.MSD;
    else if (L.statusLine === 'status' && P.statusDate) statusT = Engine.parseDT(P.statusDate);
    // liens
    const bh = Math.min(g.rows.length ? (L.rowMin * g.z) * 0.5 : 2.4, Math.max(1.4, fs * 1.15));
    if (L.showLinks && !Sch.frise) {
      for (const r of rws) {
        if (r.kind !== 'task' || !r.t.preds) continue;
        for (const p of r.t.preds) {
          const pr = pos.get(p.uid); if (!pr || pr.kind !== 'task') continue;
          o.push(linkPath(p.type, pr, r, X, bh, C.link));
        }
      }
    }
    // barres
    for (const r of rws) {
      if (r.kind === 'blank') continue;
      const b = BL && r.uid != null ? BL.d[r.uid] : null;
      const cy = r.y + r.h / 2 - (BL ? bh * 0.22 : 0);
      if (b && !r.summary) {
        const bx1 = X(b[0]), bx2 = X(b[1]), by = cy + bh / 2 + 0.25;
        if (b[1] - b[0] < 1e-6) o.push(`<path d="M${f(bx1)} ${f(by - 0.2)}l${f(bh * 0.4)} ${f(bh * 0.4)}l${f(-bh * 0.4)} ${f(bh * 0.4)}l${f(-bh * 0.4)} ${f(-bh * 0.4)}z" fill="#A9B1B8"/>`);
        else o.push(rect(bx1, by, Math.max(0.3, bx2 - bx1), bh * 0.36, '#A9B1B8'));
      }
      const x1 = X(r.es), x2 = X(r.ef);
      if (x2 < gx - 5 || x1 > gx + sl.w + 5) continue;
      if (r.summary) {
        if (!L.showSummary) continue;
        const sh = bh * 0.42, tri = bh * 0.75, ls = fs * 0.9;
        const above = L.labelSum === 'above';
        const y0 = above ? r.y + r.h - pad * 0.5 - (sh + tri * 0.7) : cy - bh / 2;
        o.push(rect(x1, y0, x2 - x1, sh, C.sum));
        o.push(`<path d="M${f(x1)} ${f(y0)}h${f(tri * 0.62)}l${f(-tri * 0.31)} ${f(tri * 0.7 + sh * 0.3)}z" fill="${C.sum}"/>`);
        o.push(`<path d="M${f(x2)} ${f(y0)}h${f(-tri * 0.62)}l${f(tri * 0.31)} ${f(tri * 0.7 + sh * 0.3)}z" fill="${C.sum}"/>`);
        if (above) {
          const lx = Math.max(x1, gx + 0.6), lab = r.name;
          o.push(rect(lx - 0.3, y0 - ls * 1.05, tw(lab, ls, true) + 0.6, ls * 1.0, r.bg));
          o.push(txt(lx, y0 - ls * 0.28, lab, ls, { fill: '#1E2328', bold: true }));
        }
      } else if (r.ms || r.ef - r.es < 1e-6) {
        const s = bh * 0.62;
        o.push(`<path d="M${f(x1)} ${f(cy - s)}L${f(x1 + s)} ${f(cy)}L${f(x1)} ${f(cy + s)}L${f(x1 - s)} ${f(cy)}z" fill="${r.crit && L.showCritical ? C.crit : C.ms}"/>`);
      } else {
        let col = r.color || (L.colorBy === 'phase' ? PHASE[r.phase % PHASE.length] : L.colorBy === 'resp' ? (C['r_' + r.resp] || RESPCOL[r.resp]) : C.task);
        if (r.crit && L.showCritical) col = C.crit;
        o.push(rect(x1, cy - bh / 2, Math.max(x2 - x1, 0.3), bh, col));
        if (r.pct > 0) o.push(rect(x1, cy - bh / 6, (x2 - x1) * Math.min(1, r.pct / 100), bh / 3, '#1E2328'));
      }
      // étiquettes
      let lab = '';
      const kind = r.summary ? (L.labelSum === 'right' ? 'name' : 'none') : (r.ms || r.ef - r.es < 1e-6) ? L.labelMs : L.label;
      if (kind === 'name') lab = r.name;
      else if (kind === 'date') lab = Sch.frise ? Time.fdate(r.es, r.t?.prec || 'd') : Time.dmy(r.ef).slice(0, 5);
      else if (kind === 'dates' && !Sch.frise) lab = Time.dmy(r.es).slice(0, 5) + ' – ' + Time.dmy(r.ef).slice(0, 5);
      else if (kind === 'dur') lab = r.dur;
      else if (kind === 'namedate') lab = r.name + '  ' + (Sch.frise ? Time.fdate(r.es, r.t?.prec || 'd') : Time.dmy(r.ef).slice(0, 5));
      else if (kind === 'dates' && Sch.frise) lab = r.startTxt + (r.endTxt && r.endTxt !== r.startTxt ? ' – ' + r.endTxt : '');
      if (lab) {
        const lx = (r.ms || r.ef - r.es < 1e-6 ? x1 + bh * 0.62 : x2) + 1, ls = fs * 0.9;
        o.push(rect(lx - 0.3, cy - ls * 0.55, tw(lab, ls) + 0.6, ls * 1.1, r.bg));
        o.push(txt(lx, cy + fs * 0.33, lab, ls, { fill: '#2B3238' }));
      }
    }
    if (statusT != null && statusT >= tA && statusT <= tB) {
      o.push(line(X(statusT), oy + tierH, X(statusT), bodyY + Hb, C.status, 0.3, ' stroke-dasharray="1.2 0.8"'));
    }
    o.push('</g>');
    // ---- tableau ----
    if (showT) {
      let cx = ox;
      for (const c of cols) {
        const lab = c.k.startsWith('x:') ? ((P.fields || []).find(f => 'x:' + f.id === c.k)?.name || '') : COLDEF[c.k] || c.k;
        o.push(txt(c.k === 'name' ? cx + pad : cx + c.w / 2, oy + Hh / 2 + fs * 0.36, lab, fs, { bold: true, anchor: c.k === 'name' ? 'start' : 'middle' }));
        cx += c.w;
        o.push(line(cx, oy, cx, bodyY + Hb, C.line, 0.12));
      }
      for (const r of rws) {
        if (r.kind === 'blank') continue;
        let cx = ox;
        const single = r.y + r.h / 2 + fs * 0.35;
        for (const c of cols) {
          const bold = r.summary;
          if (c.k === 'name') {
            const x = cx + pad + (r.ind || 0);
            if (r.lines.length === 1) o.push(txt(x, single, r.lines[0], fs, { bold }));
            else { const y0 = r.y + r.h / 2 - (r.lines.length - 1) * lineH / 2 + fs * 0.35; r.lines.forEach((ln, i) => o.push(txt(x, y0 + i * lineH, ln, fs, { bold }))); }
          } else {
            let v = '';
            if (c.k === 'id') v = r.kind === 'proj' ? '' : String(r.id);
            else if (c.k === 'dur') v = r.dur || '';
            else if (c.k === 'start') v = r.startTxt ?? Time.dmy(r.es);
            else if (c.k === 'finish') v = r.endTxt ?? Time.dmy(r.ef);
            else if (c.k === 'preds') v = r.preds || '';
            else if (c.k === 'pct') v = r.kind === 'task' && !r.summary ? Math.round(r.pct) + ' %' : '';
            else if (c.k === 'astart') v = r.astart ? Time.dmy(Engine.parseDT(r.astart)) : '';
            else if (c.k === 'afinish') v = r.afinish ? Time.dmy(Engine.parseDT(r.afinish)) : '';
            else if (c.k === 'bvar') v = r.kind === 'task' && BL ? bvar(Sch, r, BL.d[r.uid]) : '';
            else if (c.k.startsWith('x:')) v = r.kind === 'task' ? ((r.t.f || {})[c.k.slice(2)] || '') : '';
            v = ellip(v, c.w - pad * 2, fs * 0.95, bold);
            const anchor = c.k === 'id' ? 'end' : c.k === 'preds' || c.k.startsWith('x:') ? 'start' : 'middle';
            const x = anchor === 'end' ? cx + c.w - pad : anchor === 'start' ? cx + pad : cx + c.w / 2;
            o.push(txt(x, single, v, fs * 0.95, { bold, anchor, fill: c.k === 'id' ? '#59636B' : '#1E2328' }));
          }
          cx += c.w;
        }
      }
    }
    // traits horizontaux des lignes
    if (L.rowLines) for (const r of rws) o.push(line(ox, r.y + r.h, ox + tW + sl.w, r.y + r.h, '#D3D7DA', 0.08));
    // cadres
    o.push(line(gx, oy + tierH, ox + frameW, oy + tierH, C.line, 0.12));
    o.push(line(ox, bodyY, ox + frameW, bodyY, C.line, 0.25));
    o.push(rect(ox, oy, frameW, Hh + Hb, 'none', ` stroke="${C.line}" stroke-width="0.35"`));
    if (showT) o.push(line(gx, oy, gx, bodyY + Hb, C.line, 0.3));
    // cartouche
    if (Hc) o.push(cartouche(P, Sch, L, g, ox, top ? m : H - m - Hc, cw, Hc, pno, pcount, C));
    o.push('</g></svg>');
    return o.join('');
  }

  function linkPath(type, a, b, X, bh, col) {
    const ca = a.y + Math.min(a.h, 99) / 2, cb = b.y + Math.min(b.h, 99) / 2;
    const fromEnd = type === 'FS' || type === 'FF', toStart = type === 'FS' || type === 'SS';
    const ams = a.ms || a.ef - a.es < 1e-6, bms = b.ms || b.ef - b.es < 1e-6;
    let px = X(fromEnd ? a.ef : a.es) + (ams ? (fromEnd ? 1 : -1) * bh * 0.62 : 0);
    let tx = X(toStart ? b.es : b.ef) + (bms ? (toStart ? -1 : 1) * bh * 0.62 : 0);
    const d = 1.4, down = cb > ca ? 1 : -1, ar = 0.75;
    let path;
    const hx = fromEnd ? px + d : px - d;
    if (toStart) {
      if (fromEnd && tx >= px + d + 0.3) {
        // descend à la verticale jusqu'au haut de la barre suivante
        const ey = cb - down * bh / 2 - down * 0.15;
        path = `M${f(px)} ${f(ca)}H${f(tx + 0.9)}V${f(ey)}`;
        return `<path d="${path}" fill="none" stroke="${col}" stroke-width="0.16"/><path d="M${f(tx + 0.9)} ${f(ey + down * 0.05)}l${f(-ar * 0.55)} ${f(-down * ar * 1.1)}h${f(ar * 1.1)}z" fill="${col}"/>`;
      }
      const my = b.y + (down > 0 ? 0 : b.h);
      const ex = tx - d;
      path = `M${f(px)} ${f(ca)}H${f(Math.min(hx, px))}V${f(my)}H${f(ex)}V${f(cb)}H${f(tx - ar)}`;
      return `<path d="${path}" fill="none" stroke="${col}" stroke-width="0.16"/><path d="M${f(tx)} ${f(cb)}l${f(-ar * 1.1)} ${f(-ar * 0.55)}v${f(ar * 1.1)}z" fill="${col}"/>`;
    }
    const ex = tx + d;
    const vx = Math.max(hx, ex);
    path = `M${f(px)} ${f(ca)}H${f(vx)}V${f(cb)}H${f(tx + ar)}`;
    return `<path d="${path}" fill="none" stroke="${col}" stroke-width="0.16"/><path d="M${f(tx)} ${f(cb)}l${f(ar * 1.1)} ${f(-ar * 0.55)}v${f(ar * 1.1)}z" fill="${col}"/>`;
  }

  function cartouche(P, Sch, L, g, x, y, w, h, pno, pcount, C) {
    const BLn = L.baseline ? (P.baselines || []).find(x => x.id === L.baseline) : null;
    const M = P.meta || {}, o = [], ink = '#1E2328', mute = '#5F6970';
    const lab = (xx, yy, s) => txt(xx, yy, s.toUpperCase(), 1.55, { fill: mute, ls: '0.08' });
    let hh = h, legY = null;
    if (g.narrow && L.legend) { hh = h - 7; legY = y + hh; }
    o.push(rect(x, y, w, h, '#FFFFFF', ` stroke="${ink}" stroke-width="0.35"`));
    // largeurs de cellules
    const wide = !g.narrow;
    const wA = wide ? 58 : 44, wD = wide ? 62 : 46, wI = wide ? 34 : 28, wL = wide && L.legend ? Math.min(84, Math.max(60, w * 0.2)) : 0;
    const wO = w - wA - wD - wI - wL;
    let cx = x;
    const cell = (cw, fn) => { o.push(fn(cx, cw)); cx += cw; if (cx < x + w - 0.1) o.push(line(cx, y, cx, y + hh, ink, 0.2)); };
    const lines = (arr, xx, yy, maxW, size, lh, bold, max) => {
      let out = '', n = 0;
      for (const s of arr) for (const ln of wrap(s, maxW, size, bold)) { if (n >= max) break; out += txt(xx, yy + n * lh, ln, size, { bold, fill: ink }); n++; }
      return out;
    };
    // agence
    cell(wA, (cx, cw) => {
      let s = '', tx = cx + 2.5;
      if (M.logo) {
        const ls = Math.min(hh - 5, 18);
        s += `<image x="${f(cx + 2.5)}" y="${f(y + (hh - ls) / 2)}" width="${f(ls)}" height="${f(ls)}" href="${M.logo}" preserveAspectRatio="xMidYMid meet"/>`;
        tx += ls + 2;
      }
      const tw2 = cx + cw - tx - 2;
      s += lab(tx, y + 4, M.agencyRole || 'Architecte');
      s += lines([M.agency || ''], tx, y + 8.6, tw2, 3.3, 3.6, true, 2);
      s += lines((M.agencyInfo || '').split('\n'), tx, y + 13.5, tw2, 1.9, 2.4, false, Math.floor((hh - 14) / 2.4));
      return s;
    });
    // opération
    cell(wO, (cx, cw) => {
      let s = lab(cx + 2.5, y + 4, 'Opération');
      const big = Math.min(4.2, Math.max(2.8, hh * 0.15));
      s += lines([M.operation || P.title || ''], cx + 2.5, y + 4.6 + big, cw - 5, big, big * 1.1, true, 2);
      if (M.moa) { s += lab(cx + 2.5, y + hh - 7.6, "Maître d'ouvrage"); s += lines([M.moa], cx + 2.5, y + hh - 3.4, cw - 5, 2.4, 2.6, false, 1); }
      if (M.address && hh > 22) { s += txt(cx + 2.5, y + 4.6 + big * 2.3, ellip(M.address, cw - 5, 2.1), 2.1, { fill: mute }); }
      return s;
    });
    // document
    cell(wD, (cx, cw) => {
      let s = lab(cx + 2.5, y + 4, 'Document');
      s += lines([M.document || 'Planning'], cx + 2.5, y + 8.4, cw - 5, 2.9, 3.2, true, 2);
      if (M.phase) s += lines([M.phase], cx + 2.5, y + 15.2, cw - 5, 2.2, 2.5, false, 1);
      s += lab(cx + 2.5, y + hh - 6, 'Établi le');
      s += txt(cx + 2.5, y + hh - 2.3, M.indiceDate ? Time.dmy(Engine.parseDT(M.indiceDate), true) : '', 2.3, { fill: ink });
      if (P.statusDate) { s += lab(cx + cw / 2, y + hh - 6, "Date d'état"); s += txt(cx + cw / 2, y + hh - 2.3, Time.dmy(Engine.parseDT(P.statusDate), true), 2.3, { fill: ink }); }
      return s;
    });
    // légende
    const used = new Set(g.rows.filter(r => r.kind === 'task' && !r.summary && !r.ms).map(r => r.resp));
    if (wL) cell(wL, (cx, cw) => legend(L, C, cx + 2.5, y + 4, cw - 5, hh - 5, false, lab, used, BLn));
    // indice / page
    cell(wI, (cx, cw) => {
      let s = lab(cx + 2.5, y + 4, 'Indice');
      s += txt(cx + 2.5, y + 10.5, M.indice || '–', 5.2, { bold: true, fill: ink });
      if (M.indiceNote) s += lines([M.indiceNote], cx + 2.5, y + 14, cw - 5, 1.8, 2.1, false, 2);
      s += lab(cx + 2.5, y + hh - 6, 'Page');
      s += txt(cx + 2.5, y + hh - 2.2, pno + ' / ' + pcount, 2.6, { bold: true, fill: ink });
      return s;
    });
    if (legY != null) {
      o.push(line(x, legY, x + w, legY, ink, 0.2));
      o.push(legend(L, C, x + 2.5, legY + 1.2, w - 5, 5, true, lab, used, BLn));
    }
    return o.join('');
  }

  function legend(L, C, x, y, w, h, horiz, lab, used, BLn) {
    const items = L.colorBy === 'resp' ? RESP.filter(r => !used || used.has(r[0])).map(r => ['bar', r[1], C['r_' + r[0]] || r[2]]) : [['bar', 'Tâche', C.task]];
    if (L.showCritical) items.push(['bar', 'Tâche critique', C.crit]);
    if (L.showSummary) items.push(['sum', 'Récapitulatif', C.sum]);
    items.push(['ms', 'Jalon', C.ms]);
    if (BLn) items.push(['base', 'Référence : ' + BLn.name, '#A9B1B8']);
    if (L.showLinks) items.push(['link', 'Lien', C.link]);
    if (L.showClosed) items.push(['closed', 'Période non travaillée', C.closed]);
    if (L.statusLine !== 'none') items.push(['status', L.statusLine === 'today' ? "Aujourd'hui" : "Date d'état", C.status]);
    const sw = 5.5, sz = 1.95;
    const sym = (k, xx, yy, col) => {
      if (k === 'bar') return rect(xx, yy - 0.9, sw, 1.8, col);
      if (k === 'base') return rect(xx, yy - 0.35, sw, 0.7, col);
      if (k === 'sum') return rect(xx, yy - 0.9, sw, 0.8, col) + `<path d="M${f(xx)} ${f(yy - 0.9)}h1.1l-0.55 1.5z M${f(xx + sw)} ${f(yy - 0.9)}h-1.1l0.55 1.5z" fill="${col}"/>`;
      if (k === 'ms') return `<path d="M${f(xx + sw / 2)} ${f(yy - 1.2)}l1.2 1.2l-1.2 1.2l-1.2 -1.2z" fill="${col}"/>`;
      if (k === 'link') return line(xx, yy, xx + sw - 0.8, yy, col, 0.16) + `<path d="M${f(xx + sw)} ${f(yy)}l-0.9 -0.45v0.9z" fill="${col}"/>`;
      if (k === 'closed') return rect(xx, yy - 1.3, sw, 2.6, col, ' stroke="#B9BEC2" stroke-width="0.1"');
      return line(xx + sw / 2, yy - 1.4, xx + sw / 2, yy + 1.4, col, 0.3, ' stroke-dasharray="0.8 0.5"');
    };
    let s = '';
    if (horiz) {
      let xx = x;
      const yy = y + h / 2 - 0.3;
      for (const [k, t, col] of items) { s += sym(k, xx, yy, col) + txt(xx + sw + 1.2, yy + sz * 0.36, t, sz, { fill: '#1E2328' }); xx += sw + 3.5 + tw(t, sz); }
      return s;
    }
    s += lab(x, y, 'Légende');
    const ncol = items.length > 4 && w > 56 ? 2 : 1, cw = w / ncol, rows = Math.ceil(items.length / ncol);
    const lh = Math.min(3.6, (h - 2.5) / rows);
    items.forEach(([k, t, col], i) => {
      const c = Math.floor(i / rows), r = i % rows, xx = x + c * cw, yy = y + 3.2 + r * lh;
      s += sym(k, xx, yy, col) + txt(xx + sw + 1.2, yy + sz * 0.36, ellip(t, cw - sw - 2, sz), sz, { fill: '#1E2328' });
    });
    return s;
  }

  return { build, PAPERS, PHASE, tw, RESP, RESPCOL, guessResp, friseprec, bvar, filterSet, strip };
})();

/* Formats d'échange : MS Project XML (2003 à 365), MPX (Project 98/2000), GanttProject (.gan), CSV (Excel et outils en ligne) */
const Formats = (() => {
  const pad = n => String(n).padStart(2, '0');
  const xesc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
  const ymd = x => Time.ymd(Math.floor(x + 1e-7));
  function isoDT(x) { // instant → AAAA-MM-JJTHH:MM:SS
    let D = Math.floor(x + 1e-7), mins = Math.round((x - D) * 1440); if (mins >= 1440) { D++; mins -= 1440; }
    const [y, m, d] = ymd(D); return `${y}-${pad(m + 1)}-${pad(d)}T${pad(Math.floor(mins / 60))}:${pad(mins % 60)}:00`;
  }
  const UF = { d: 7, w: 9, mo: 11, h: 5, min: 3 };
  function hoursOf(d, hpd) {
    if (!d || !d.v) return 0;
    if (d.e) return d.v * ({ d: 24, w: 168, mo: 720, h: 1, min: 1 / 60 }[d.u] || 24);
    return d.v * ({ d: hpd, w: hpd * 5, mo: hpd * 20, h: 1, min: 1 / 60 }[d.u] || hpd);

/* planning d'agence : assemble les plannings inclus en une frise datée, plus les lignes propres à l'agence */
function compose(P) {
  const tasks = []; let k = 0;
  const endDay = (ef, cal) => { const fe = ef - Math.floor(ef); return fe <= cal.s + 1e-6 && fe > 1e-6 ? Math.floor(ef) - 1 : Math.floor(ef - 1e-7); };
  for (const s of P.subs || []) {
    const d = st.list.find(x => x.id === s.id); if (!d || d.project.kind === 'agence') continue;
    k++;
    let SP; try { SP = normalize(clone(d.project)); } catch (e) { continue; }
    const SS = Engine.schedule(SP), base = k * 1000000;
    const name = SP.meta?.operation || SP.title || d.name;
    const head = { uid: base, name, level: 1, ro: true, src: s.id, prec: 'd', dur: { v: 0, u: 'd', e: false }, preds: [] };
    if (s.detail === 'bar' || !SP.tasks.some(t => !t.blank)) { head.start = Time.iso(SS.start); head.end = Time.iso(endDay(SS.finish, SS.cal)); tasks.push(head); continue; }
    tasks.push(head);
    const maxL = s.detail === 'l1' ? 1 : s.detail === 'l2' ? 2 : 99;
    for (const t of SP.tasks) {
      if (t.blank || t.level > maxL) continue;
      const r = SS.R.get(t.uid); if (!r) continue;
      const ms = !!t.ms && !r.summary || r.ef - r.es < 1e-6;
      tasks.push({ uid: base + t.uid, name: t.name, level: t.level + 1, ro: true, src: s.id, ms, prec: SS.frise ? (t.prec || 'd') : 'd',
        start: Time.iso(r.es), end: Time.iso(ms ? r.es : Math.max(Math.floor(r.es), SS.frise ? Math.floor(r.ef - 1e-7) : endDay(r.ef, SS.cal))),
        resp: t.resp || Print.guessResp(t.name), color: t.color, f: t.f, dur: { v: 0, u: 'd', e: false }, preds: [] });
    }
  }
  for (const t of P.tasks || []) tasks.push(t);
  return { kind: 'frise', agence: true, title: P.title, meta: P.meta, layout: P.layout, calendar: P.calendar, hoursPerDay: P.hoursPerDay, fields: P.fields, baselines: P.baselines, tasks };
}

/* Dates saisies : jj/mm/aa ou jj/mm/aaaa */
function parseDMY(s) {
  const m = String(s || '').trim().match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?$/);

}

function commitCell(uid, f, val, input) {
  const t = st.P.tasks.find(x => x.uid === uid); if (!t) return;
  const R = st.Sch.R;

  if (f === 'name') { if (val.trim() === t.name) return; mutate(() => { t.name = val.trim() || 'Sans nom'; }); return; }
  if (f === 'dur') {
    const d = Engine.parseDur(val);
    if (!d || d.v < 0) { flash(input, 'Durée non reconnue : écrivez par exemple 5 j, 2 sem ou 1 moisé.'); return; }
    mutate(() => { t.dur = d; t.ms = d.v === 0; });

  if (f === 'start') {
    if (!val.trim()) { mutate(() => { delete t.cons; }); return; }
    const iso = parseDMY(val);
    if (!iso) { flash(input, 'Date non reconnue : écrivez jj/mm/aa.'); return; }
    mutate(() => { t.cons = { type: 'SNET', date: iso + 'T09:00' }; });
    return;
  }
  if (f === 'fstart' || f === 'fend') {
    const p = parseFlex(val, f === 'fend');
    if (!p) { flash(input, 'Date non reconnue : écrivez 1850, 03/1850 ou 12/03/1850.'); return; }
    mutate(() => {
      t.prec = p.prec;
      if (f === 'fstart') { t.start = p.iso; if (t.ms || !t.end || t.end < p.iso) t.end = t.ms ? p.iso : (t.end && t.end >= p.iso ? t.end : p.iso); }
      else { t.end = p.iso; if (!t.start || t.start > p.iso) t.start = p.iso; }
    });
    return;
  }
  if (f === 'preds') {
    const T = st.P.tasks;
    const res = Engine.parsePreds(val, id => (T[id - 1] && !T[id - 1].blank ? T[id - 1].uid : null));
    if (res.bad.length) { flash(input, 'Antécédent non reconnu : ' + res.bad.join(', ')); return; }
    mutate(() => { t.preds = res.preds.filter(p => p.uid !== uid); });
  }
}

function insertRow(kind) {

function setLayout(key, val, rerenderPanel) {
  const L = st.P.layout;
  st.undo.push(JSON.stringify(st.P)); st.redo = [];
  if (key === 'fitMode') L.fitW = val === 'fit' ? Math.max(1, L.fitW || 1) : 0;
  else if (key === 'fitHMode') L.fitH = val === 'fit' ? Math.max(1, L.fitH || 1) : 0;
  else if (key === 'tiers') { if (val === 'auto') L.tierTop = 'auto'; else [L.tierTop, L.tierBottom] = val.split('/'); }
  else if (key === 'range' && val === 'custom' && !L.from) { L.range = val; L.from = Time.iso(st.Sch.start); L.to = Time.iso(st.Sch.finish); }
  else L[key] = val;
  scheduleSave();
  if (rerenderPanel) { const sc = $('#pset')?.scrollTop; const open = $$('#pset details').map(d => d.open); renderPrint(); const ps = $('#pset'); if (ps) { ps.scrollTop = sc; $$('#pset details').forEach((d, i) => d.open = open[i] ?? d.open); } }
  else previewSoon();
}

async function exportPDF() {
  const btn = $('#btnPdf');
  if (!window.jspdf || !window.jspdf.jsPDF) { setStatus("La bibliothèque PDF n'a pas pu être chargée.", 'err'); return; }
  const B = Print.build(viewP(), st.Sch, st.P.layout), g = B.g;
  btn.disabled = true; btn.textContent = 'Préparation du PDF…';
  try {
    const { jsPDF } = window.jspdf;
    const orient = g.W > g.H ? 'landscape' : 'portrait';
    const doc = new jsPDF({ unit: 'mm', format: [g.W, g.H], orientation: orient, compress: true });
    const host = document.createElement('div'); host.style.cssText = 'position:fixed;left:-99999px;top:0;width:10px;height:10px;overflow:hidden';
    document.body.appendChild(host);
    for (let k = 0; k < B.pages.length; k++) {
      if (k) doc.addPage([g.W, g.H], orient);
      host.innerHTML = B.pages[k].svg;
      await doc.svg(host.firstElementChild, { x: 0, y: 0, width: g.W, height: g.H });
    }
    host.remove();
    const M = st.P.meta;
    doc.setProperties({ title: (M.operation || st.P.title || 'Planning') + ' – ' + (M.document || 'Planning'), author: M.agency || '', creator: 'TerraPlanning' });
    const blob = doc.output('blob');
    const name = `${(M.operation || st.P.title || 'Planning').replace(/[\\/:*?"<>|]+/g, '-').slice(0, 80)} - planning${M.indice ? ' ind ' + M.indice : ''}.pdf`;
    await download(name, blob);
  } catch (e) { console.error(e); setStatus('Le PDF n\'a pas pu être créé : ' + (e.message || e.code || e), 'err'); }
  btn.disabled = false; btn.textContent = 'Exporter en PDF';
}
const DL_OK = /\.(json|csv|pdf|txt|md|html|svg|xlsx|docx|zip|png|jpg)$/i;
async function download(name, data) {
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
  if (dl) {
    let zipped = false;
    if (!DL_OK.test(name)) {
      // la visionneuse n'accepte pas les .xml, .mpx, .gan : on les livre dans un .zip
      if (!window.JSZip) { setStatus('Compression indisponible : la bibliothèque n\'a pas pu être chargée.', 'err'); return; }
      const z = new JSZip(); z.file(name, data); data = await z.generateAsync({ type: 'blob' }); name += '.zip'; zipped = true;
    }
    try { await dl.save({ filename: name, data }); setStatus(zipped ? 'Fichier proposé dans un .zip : décompressez-le avant de l\'ouvrir' : 'Fichier proposé au téléchargement', 'ok'); }
    catch (e) { if (e.code !== 'declined') setStatus('Téléchargement impossible ici (' + (e.code || 'erreur') + ')', 'err'); }
    return;
  }
  // hors visionneuse (fichier ouvert localement)
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); a.download = name; a.click(); }
  catch (e) { setStatus('Téléchargement indisponible dans cette vue.', 'err'); }
}

function feries(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3),
    h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  const E = Time.day(y, mo - 1, da);
  return [[Time.day(y, 0, 1), "Jour de l'an"], [E + 1, 'Lundi de Pâques'], [Time.day(y, 4, 1), 'Fête du Travail'], [Time.day(y, 4, 8), 'Victoire 1945'], [E + 39, 'Ascension'], [E + 50, 'Lundi de Pentecôte'], [Time.day(y, 6, 14), 'Fête nationale'], [Time.day(y, 7, 15), 'Assomption'], [Time.day(y, 10, 1), 'Toussaint'], [Time.day(y, 10, 11), 'Armistice'], [Time.day(y, 11, 25), 'Noël']]
    .map(([D, n]) => ({ from: Time.iso(D), to: Time.iso(D), name: n }));
}

    const preds = [];
    for (const p of t.children) if (p.localName === 'PredecessorLink') {

    }
    const task = { uid, name: val(t, 'Name'), level: +(val(t, 'OutlineLevel') || 1), dur: toDur(hours(val(t, 'Duration')), val(t, 'DurationFormat') || 7), ms: val(t, 'Milestone') === '1', pct: +(val(t, 'PercentComplete') || 0), preds };
    const ct = CT[val(t, 'ConstraintType')]; if (ct && val(t, 'ConstraintDate')) task.cons = { type: ct, date: val(t, 'ConstraintDate').slice(0, 16) };
    const n = val(t, 'Notes'); if (n && n.trim()) task.notes = n.trim();
    startOf.set(uid, val(t, 'Start')?.slice(0, 16));
    tasks.push(task);
  }
  const P = { title: val(root, 'Title') || val(root, 'Name') || '', start: (val(root, 'StartDate') || '').slice(0, 16), statusDate: (val(root, 'StatusDate') || '').slice(0, 16) || null, hoursPerDay: minPerDay / 60, calendar, tasks };
  // tâches libres démarrant après le début du projet : fixer leur début (comme dans le fichier d'origine)
  const stack = [];
  tasks.forEach((t, i) => {
    if (t.blank) return;
    while (stack.length && stack[stack.length - 1].level >= t.level) stack.pop();
    const inh = stack.some(a => a.preds.length || a.cons);
    const nx = tasks.slice(i + 1).find(x => !x.blank);
    const leaf = !(nx && nx.level > t.level);

    stack.push(t);
  });

}

}

/* ---------- tactile : appui long = sélection, pincer = zoom, toucher une barre en consultation = détails ---------- */
(() => {
  let lp = null, lpDone = false;
  document.addEventListener('pointerdown', e => {
    const num = e.target.closest('.tr .c.num'); if (!num || e.pointerType === 'mouse') return;
    const uid = +num.closest('.tr').dataset.uid;
    lp = setTimeout(() => { lp = null; lpDone = true; st.selMode = true; if (!st.multi.size && st.sel != null) st.multi.add(st.sel); st.multi.add(uid); st.sel = uid; renderEdit(); }, 480);
  }, true);
  const cancel = () => { if (lp) { clearTimeout(lp); lp = null; } };
  document.addEventListener('pointerup', cancel, true); document.addEventListener('pointercancel', cancel, true);
  document.addEventListener('pointermove', e => { if (lp && (Math.abs(e.movementX) + Math.abs(e.movementY) > 6)) cancel(); }, true);
  document.addEventListener('click', e => { if (lpDone && e.target.closest('.tr .c.num')) { lpDone = false; e.stopImmediatePropagation(); e.preventDefault(); } }, true);
  // pincer pour zoomer sur le diagramme
  const pts = new Map(); let d0 = null, p0 = null;
  document.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch' || !e.target.closest('#scroller') || e.target.closest('[data-mode]')) return; pts.set(e.pointerId, e.clientX); if (pts.size === 2) { const [a, b] = [...pts.values()]; d0 = Math.abs(a - b); p0 = st.ppd; } }, true);
  document.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, e.clientX);
    if (pts.size === 2 && d0 > 20) { const [a, b] = [...pts.values()], d = Math.abs(a - b); cancelAnimationFrame(st.pz); st.pz = requestAnimationFrame(() => zoomTo(p0 * d / d0, (a + b) / 2)); }
  }, true);
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) d0 = null; };
  document.addEventListener('pointerup', up, true); document.addEventListener('pointercancel', up, true);
  document.addEventListener('click', e => { if (st.tab !== 'view') return; const g = e.target.closest('[data-bar]'); if (g) showInfo(+g.dataset.bar); });
  // menu d'en-tête et changement de largeur
  document.addEventListener('click', e => { if (e.target.closest('#btnMenu')) { document.getElementById('app').classList.toggle('menuopen'); } });
  let wasN = narrow();
  window.addEventListener('resize', () => { const n = narrow(); document.getElementById('app').classList.toggle('narrow', n); if (n !== wasN) { wasN = n; if (st.P && (st.tab === 'edit' || st.tab === 'view')) renderView(); } });
  document.getElementById('app').classList.toggle('narrow', narrow());
})();

/* carnet exporté par TerraContacts 0.1 : lots habituels dans l'ancienne liste, convertis en nomenclature TerraSuite */
const CONTACT_LOTS_OLD = { '00': ['00'], '01': ['01'], '02': ['02'], '03': ['03', '04'], '04': ['05'], '05': ['07'], '06': ['08'], '07': ['09'], '08': ['10'], '09': ['11', '12'], '10': ['13'], '11': ['16'], '12': ['14'], '13': ['15'], '14': ['17'], '15': ['18', '19'] };
async function importCarnet(file) {
  let d; try { d = JSON.parse(await file.text()); } catch (e) { setStatus('Fichier illisible.', 'err'); return; }
  if (!d || d.format !== 'terrasuite-contacts' || !Array.isArray(d.contacts)) { setStatus('Ce fichier n\'est pas un carnet TerraContacts (export « Format d\'échange TerraSuite »).', 'err'); return; }
  const contacts = d.contacts.filter(c => c && c.nom).map(c => ({ id: c.id || '', role: c.role || 'ENT', agence: !!c.agence, nom: c.nom, ville: c.ville || '', tel: c.tel || '', email: c.email || '', lots: c.nomen === 'ts1' ? c.lots || [] : [...new Set((c.lots || []).flatMap(x => CONTACT_LOTS_OLD[x] || [x]))], personnes: (c.personnes || []).map(p => ({ prenom: p.prenom || '', nom: p.nom || '', fonction: p.fonction || '', mobile: p.mobile || '', tel: p.tel || '', email: p.email || '', principal: !!p.principal })) }));
  if (!Carnet.set({ date: String(d.date || new Date().toISOString()).slice(0, 10), contacts })) { setStatus('Carnet non enregistré : espace de stockage plein.', 'err'); return; }
  let upd = 0;
  if (st.P && (st.P.lots || []).length) {
    const next = st.P.lots.map(l => { if (!l.ent) return l; const c = contacts.find(k => !k.agence && (l.ent.cid && k.id === l.ent.cid || Print.strip(k.nom) === Print.strip(l.ent.nom))); if (!c) return l; const s = entSnap(c); if (JSON.stringify(s) === JSON.stringify(l.ent)) return l; upd++; return { ...l, ent: s }; });
    if (upd) mutate(P => { P.lots = next; }); else renderAll();
  } else renderAll();

}
async function importLots(file) {
  let d; try { d = JSON.parse(await file.text()); } catch (e) { setStatus('Fichier illisible.', 'err'); return; }
  if (!d || d.format !== 'terrasuite-lots' || !Array.isArray(d.lots)) { setStatus('Ce fichier n\'est pas un export « entreprises par lot » de TerraEstim.', 'err'); return; }
  if (!st.P) return;
  let add = 0, upd = 0;
  mutate(P => {
    P.lots = P.lots || [];
    for (const x of d.lots) { if (!x || !x.code) continue;
      let l = P.lots.find(y => lotKey(y.code) === lotKey(x.code));
      if (!l) { l = { code: String(x.code), nom: x.nom || '' }; P.lots.push(l); add++; } else if (!l.nom && x.nom) l.nom = x.nom;
      if (x.entreprise && x.entreprise.nom) { const prev = l.ent ? l.ent.nom : ''; l.ent = { cid: x.entreprise.cid || '', nom: x.entreprise.nom, contact: x.entreprise.contact || '', tel: x.entreprise.tel || '', email: x.entreprise.email || '' }; fillEnt(P, l, prev); upd++; } }
    P.lots.sort((a, b) => lotSort(a.code, b.code));

  setStatus(`${d.operation ? d.operation + ' : ' : ''}${add} lot(s) ajouté(s), ${upd} entreprise(s) reprise(s)`, 'ok');

const lotSort = (a, b) => String(a).localeCompare(String(b), 'fr', { numeric: true });
/* écrit l'entreprise de chaque lot dans la colonne Entreprise ; ne touche pas aux entreprises saisies à la main qui diffèrent de l'ancienne attribution (prev) */
function fillEnt(P, onlyLot, prev) {
  const le = lotEntFields(P); if (!le.lot) return { n: 0, nolot: true };
  if (!le.ent) le.ent = addField(P, 'Entreprise');
  let n = 0;
  for (const t of P.tasks) { if (t.blank || !t.f || !t.f[le.lot.id]) continue;
    const L = lotFind(t.f[le.lot.id], P); if (!L || (onlyLot && L !== onlyLot)) continue;
    const cur = t.f[le.ent.id] || '', want = L.ent ? L.ent.nom : '';
    if (onlyLot && cur && cur !== prev) continue;
    if (cur === want) continue;
    if (want) t.f[le.ent.id] = want; else delete t.f[le.ent.id]; n++; }
  return { n };
}
function lotsAct(k, pa) {
  if (k === 'projlots') { const pj = projOfP(); if (!pj) return true; let n = 0; mutate(P => { n = projLots(P, pj); }); setStatus(`${n} lot(s) du projet repris`, 'ok'); return true; }

  if (k === 'dellot') { mutate(P => { P.lots.splice(+pa.dataset.i, 1); }); return true; }
  if (k === 'impcarnet') { $('#carnetIn').click(); return true; }
  if (k === 'implots') { $('#lotsIn').click(); return true; }
  if (k === 'lotsfromtasks') {
    const le = lotEntFields(); if (!le.lot) { setStatus('Ajoutez d\'abord la colonne libre « Lot » et indiquez le lot des tâches.', 'err'); return true; }
    let add = 0;
    mutate(P => { P.lots = P.lots || [];
      for (const t of P.tasks) { const v = t.f && t.f[le.lot.id]; if (!v || lotFind(v, P)) continue; const s = lotSplit(v); P.lots.push({ code: s.code, nom: s.nom }); add++; }
      P.lots.sort((a, b) => lotSort(a.code, b.code)); });
    setStatus(add ? `${add} lot(s) repris de la colonne Lot` : 'Aucun nouveau lot dans la colonne Lot', add ? 'ok' : ''); return true;
  }
  if (k === 'fillent') {
    if (!lotEntFields().lot) { setStatus('Ajoutez d\'abord la colonne libre « Lot » et indiquez le lot des tâches.', 'err'); return true; }
    let r; mutate(P => { r = fillEnt(P); });
    setStatus(r.n ? `${r.n} tâche(s) mise(s) à jour dans la colonne Entreprise` : 'Colonne Entreprise déjà à jour', 'ok'); return true;
  }

}
function lotsChange(el) {
  if (el.id === 'carnetIn') { if (el.files[0]) importCarnet(el.files[0]); el.value = ''; return true; }
  if (el.id === 'lotsIn') { if (el.files[0]) importLots(el.files[0]); el.value = ''; return true; }

    else if (k === 'ent') { const prev = l.ent ? l.ent.nom : ''; const e = entFromName(el.value); if (e) l.ent = e; else delete l.ent; fillEnt(P, l, prev); } });

/* saisie d'un lot dans une tâche : l'entreprise du lot est proposée si la colonne Entreprise est vide */
function lotAutoEnt(t, fid) {

const projOfP = (P = st.P) => P && P.projet ? st.projets.find(p => p.id === P.projet) || null : null;

function projFill(P, pj) { if (!pj) return; const M = P.meta; if (!M.operation || M.operation === P.title) M.operation = pj.nom || M.operation; if (!M.address) M.address = projAddr(pj); if (!M.moa) M.moa = pj.moa || ''; if (!M.phase && pj.phase) M.phase = pj.phase; }
function projLots(P, pj) {
  P.lots = P.lots || []; let n = 0;
  for (const l of pj.lots || []) { const code = String(l.num || '').trim(); if (!code) continue; let x = P.lots.find(y => lotKey(y.code) === lotKey(code));

/* TerraPlanning.html#projet=… : planning du projet, sinon formulaire de création ; #planning=… : un planning */

/* ===== Accueil de TerraPlanning : que faire en arrivant ===== */
function openPlanning(id) { st.tab = 'edit'; openProject(id); }
function projPlanning(pid) { const d = st.list.filter(x => x.project && x.project.projet === pid).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0]; if (d) return openPlanning(d.id); st.newProjet = pid; newProject(); }
function newWith(tpl) { newProject(); requestAnimationFrame(() => { const r = document.querySelector(`input[name="tpl"][value="${tpl}"]`); if (r) r.checked = true; }); }
function renderHome() {
  const pc = pid => { const p = (st.projets || []).find(x => x.id === pid); return p ? p.code || '' : ''; };
  const kind = d => d.project.kind === 'agence' ? 'agence' : d.project.kind === 'frise' ? 'frise' : '';
  const cur = st.P && st.list.find(d => d.id === st.curId);
  Ori.render($('#view'), {
    titre: 'TerraPlanning',
    lead: 'Plannings d\'études et de chantier, diagrammes de Gantt, mise en page imprimée, échanges avec MS Project. Choisissez ce que vous voulez faire, ou reprenez votre dernier planning.',
    reprendre: cur ? { t: cur.name || 'Planning', s: 'Modifié le ' + Ori.date(cur.updatedAt), go: () => { st.tab = 'edit'; renderAll(); } } : null,
    actions: [
      { ic: 'plus', pri: true, t: 'Créer un planning', s: 'À partir d\'un modèle : études complètes, chantier complet, ou planning vierge.', go: () => newWith('chantier') },
      { ic: 'up', t: 'Importer un fichier', s: 'MS Project (.mpp, .xml, .mpx), GanttProject, Excel, CSV ou JSON : ajouté à vos plannings.', go: () => $('#fileIn').click() },
      { ic: 'open', t: 'Ouvrir un planning existant', s: 'Dans la liste ci-dessous, ou avec le menu « Planning » en haut.', go: () => { const q = document.querySelector('.ori-q') || document.querySelector('.ori-ul button'); if (q) q.focus(); } },
      { ic: 'proj', t: 'Planning d\'un projet', s: 'Un planning rattaché à un projet de l\'agence, avec ses lots et ses entreprises.', go: () => { const b = document.querySelector('.ori-pj button'); if (b) b.focus(); else location.href = TSP_OK() ? TSP.hub('') : '#'; } },
      { ic: 'grid', t: 'Planning d\'agence', s: 'Regroupe vos plannings de projet sur une même frise, mise à jour automatiquement.', go: () => newWith('agence') },
      { ic: 'chart', t: 'Frise chronologique', s: 'Grandes périodes en années, décennies ou siècles (histoire d\'un bâtiment).', go: () => newWith('frise') }
    ],
    liste: { titre: 'Vos plannings', recherche: true, vide: 'Aucun planning : créez-en un ou importez un fichier.', items: st.list.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).map(d => ({ c: pc(d.project.projet) || kind(d), t: d.name || d.id, s: Ori.date(d.updatedAt), go: () => openPlanning(d.id) })) },
    projets: TSP_OK() ? { titre: 'Projets de l\'agence', vide: 'Aucun projet : créez-les dans TerraContacts, onglet Projets.', items: (st.projets || []).filter(p => p.statut !== 'archive' && p.statut !== 'termine').map(p => ({ c: p.code, t: p.nom, boutons: [{ t: st.list.some(d => d.project && d.project.projet === p.id) ? 'Ouvrir son planning' : 'Créer son planning', go: () => projPlanning(p.id) }] })) } : null,
    etapes: ['<b>Créez</b> un planning à partir d\'un modèle, ou importez un fichier MS Project.', '<b>Saisie</b> : ajustez les durées, les liens entre tâches, les lots et les entreprises.', '<b>Projet et calendrier</b> : congés et jours fériés, entreprises par lot, planning de référence.', '<b>Mise en page</b> : format, colonnes, cartouche, puis export PDF.', '<b>Exporter</b> vers MS Project 2003 (MPX) ou en JSON pour l\'autre poste.'],
    pied: 'Vos plannings sont enregistrés dans ce navigateur. Exportez-les (menu Exporter, JSON) pour les retrouver sur un autre poste.' + (typeof TSA !== 'undefined' ? '<br>' + TSA.pied() : '')
  });
}

/* lien vers la page d'accueil, seulement pour la version locale (sur disque) */
if (location.protocol !== 'file:') { const h = document.getElementById('homeLink'); if (h) h.remove(); }
bind();
renderAll();
Store.start(onList).then(async () => {
  if (Store.kind === 'local') setStatus('Enregistrement dans ce navigateur uniquement');
  try { await loadProjets(); await openProjetHash(); renderAll(); if (TSP_OK()) TSP.onChange(async () => { if (await loadProjets() && !['edit', 'view'].includes(st.tab)) renderAll(); }); } catch (e) { console.warn('projets', e); }
});
window.addEventListener('hashchange', () => { openProjetHash(); });
window.TF = { st, Store, addProject, openProject };

</script>
</body></html>
