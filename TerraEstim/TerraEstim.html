<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>TerraEstim</title>

<style>
/* Bureau d'économiste : barre d'outils dense, base de prix en tableau, panneau de détail à droite. Même famille visuelle que TerraPlanning, accent vert TerraEstim. */
:root{
  --bg:#EEF0EE; --panel:#FFFFFF; --sunk:#F5F7F5; --ink:#1C2422; --muted:#5E6B67; --line:#D3DAD6; --line2:#E5EAE7;
  --accent:#23684A; --accent-ink:#FFFFFF; --accent-soft:#DCEDE3; --sel:#E4F1E9;
  --warn:#9A5B00; --warn-bg:#FFF4DF; --err:#B3261E; --ok:#2E6B3F; --info:#24546E;
  --dot:#23684A; --dot2:#9AA8A3; --med:#C2410C;
  --f-ui:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-cond:"IBM Plex Sans Condensed","Arial Narrow","IBM Plex Sans",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131817; --panel:#1B2120; --sunk:#171D1C; --ink:#E1E8E5; --muted:#96A39F; --line:#313B38; --line2:#27302E;
  --accent:#7CC7A0; --accent-ink:#0D1B14; --accent-soft:#1E3A2D; --sel:#1D3229;
  --warn:#E2B15A; --warn-bg:#2E2512; --err:#F08A80; --ok:#7CC48F; --info:#7DB4CF;
  --dot:#7CC7A0; --dot2:#5D6B67; --med:#F0956A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131817; --panel:#1B2120; --sunk:#171D1C; --ink:#E1E8E5; --muted:#96A39F; --line:#313B38; --line2:#27302E;
  --accent:#7CC7A0; --accent-ink:#0D1B14; --accent-soft:#1E3A2D; --sel:#1D3229;
  --warn:#E2B15A; --warn-bg:#2E2512; --err:#F08A80; --ok:#7CC48F; --info:#7DB4CF;
  --dot:#7CC7A0; --dot2:#5D6B67; --med:#F0956A; color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px;line-height:1.4}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%;min-height:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-cond);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.ver{font-family:var(--f-mono);font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 7px;letter-spacing:0;text-transform:none;font-weight:400}
.brand small{font-family:var(--f-ui);font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:2px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;padding:5px 12px;border-radius:5px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tabs button .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:4px}
.grow{flex:1}
.status{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.status.ok{color:var(--ok)} .status.err{color:var(--err)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.danger{color:var(--err)}
.btn.sm{padding:2px 7px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 7px;min-width:0}
textarea{width:100%;resize:vertical}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.toolbar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--sunk)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.toolbar label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.msg{margin:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));padding:7px 10px;border-radius:6px;background:var(--warn-bg);color:var(--warn);font-size:12.5px}
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.work.wide{grid-template-columns:minmax(0,1fr) 460px}
.scroller{overflow:auto;min-height:0;background:var(--panel)}
.side{border-left:1px solid var(--line);background:var(--sunk);overflow:auto;padding:14px 16px 30px;display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.side h3,.card h3{margin:0;font-family:var(--f-cond);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.side h2{margin:0;font-family:var(--f-cond);font-weight:600;font-size:18px;text-wrap:balance}
/* tableaux */
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.t th{position:sticky;top:0;z-index:2;background:var(--panel);text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:5px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.t tr.row{cursor:pointer}
.t tr.row:hover td{background:var(--sunk)}
.t tr.sel td{background:var(--sel)}
.t .num,.t th.num{text-align:right;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.t .mono{font-family:var(--f-mono);font-size:12px}
.t .muted{color:var(--muted)}
.t tr.lot td{background:var(--sunk);font-family:var(--f-cond);font-weight:600;font-size:13px;letter-spacing:.03em;border-bottom:1px solid var(--line)}
.t tr.lot td.num{font-family:var(--f-mono)}
.t tr.chap td{color:var(--muted);font-style:italic}
.t tr.art td{color:var(--accent);font-family:var(--f-cond);font-weight:600;font-size:12.5px;padding-top:8px;border-bottom:1px dashed var(--line)}
.t tr.art td a{color:inherit;text-decoration:none;cursor:pointer}
.t tr.art td a:hover{text-decoration:underline}
.chip a{text-decoration:none} .chip a:hover{text-decoration:underline}
.artbox{white-space:pre-wrap;font-size:12px;max-height:220px;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;margin:0}
.t input,.t select{width:100%;font-size:12.5px;padding:3px 5px}
.t input.num{text-align:right}
.t td.ed{padding:2px 4px}
.range{color:var(--muted);font-size:11.5px}
.tag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:500;white-space:nowrap}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.mut{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.tag.err{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>label,.lbl{font-size:11.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.big{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.big small{font-size:12px;color:var(--muted);font-family:var(--f-ui)}
.hint{font-size:11.5px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.dch{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:8px;vertical-align:middle;font-family:var(--f-body,inherit);font-weight:400}
.dch a,.ldoc a{font-size:11px;line-height:1.5;padding:0 7px;border-radius:9px;border:1px solid var(--line);background:var(--panel,#fff);color:var(--ink,inherit);text-decoration:none;white-space:nowrap}
.dch a:hover,.ldoc a:hover{border-color:var(--accent);text-decoration:none}
.ldoc{display:flex;flex-wrap:wrap;gap:4px;padding:2px 6px 4px}
.sug{display:flex;flex-direction:column;gap:4px}.sug button{text-align:left;justify-content:flex-start;white-space:normal}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 4px 3px 9px}
.chip small{font-weight:400;opacity:.8}
.chip button{border:0;background:transparent;cursor:pointer;color:inherit;font-size:14px;line-height:1;padding:0 4px}
.chips select{font-size:12px;padding:2px 5px}
input.bad{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px}
.empty{margin:auto;max-width:520px;text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{margin:0;font-family:var(--f-cond);font-weight:600;font-size:20px;text-wrap:balance}
.empty p{margin:0;color:var(--muted)}
.empty ol{text-align:left;color:var(--muted);margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.pane{overflow:auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;max-width:1200px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tblwrap{overflow:auto;max-height:420px;border:1px solid var(--line2);border-radius:6px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.steps span{padding:3px 9px;border-radius:12px;border:1px solid var(--line)}
.steps span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps span.done{color:var(--accent);border-color:var(--accent)}
.score{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.score.hi{color:var(--ok)} .score.lo{color:var(--warn)}
.ac{position:relative}
.acl{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 2px);background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:280px;overflow:auto;min-width:320px}
.acl button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 9px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--line2)}
.acl button:hover,.acl button.on{background:var(--sel)}
.acl button small{display:block;color:var(--muted);font-size:11px}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:13px;max-width:420px;margin-left:auto}
.totals dt{color:var(--muted)} .totals dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.totals .tot{font-weight:600;color:var(--ink);border-top:1px solid var(--line);padding-top:4px}
.ovr{color:var(--info)}
.flag{color:var(--warn)}
.expwrap{position:relative}
.menu{position:absolute;top:calc(100% + 4px);right:0;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px;width:320px;max-width:calc(100vw - 32px);display:flex;flex-direction:column}
.menu button{border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:5px;cursor:pointer;line-height:1.35}
.menu button:hover,.menu button:focus-visible{background:var(--sel)}
.menu button span{display:block;font-size:11.5px;color:var(--muted)}
.imp th select{display:block;width:100%;margin-top:4px;text-transform:none;letter-spacing:0;font-weight:400;font-size:12px}
.imp td{white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.imp tr.hdr td{background:var(--accent-soft)}
.imp tr.skip td{color:var(--muted)}
.paste{width:100%;min-height:120px;font-family:var(--f-mono);font-size:12px}
@media (max-width: 900px){
  #app{height:auto;min-height:100%}
  .view{flex:none}
  .work,.work.wide{grid-template-columns:1fr;grid-template-rows:auto auto}
  .scroller{max-height:65vh}
  .side{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width: 1500px){ .brand small{display:none} }
@media (max-width: 600px){
  .row3{grid-template-columns:1fr 1fr}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script>
/* ================= TerraEstim : noyau (utilitaires, données, calcul des prix) ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- Nombres et mois ---------- */
function parseNum(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).replace(/[  \s]/g, '').replace(/€|EUR|HT|TTC/gi, '');
  if (!s) return null;
  if (/^-?[\d.]+,\d+$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d+,\d+$/.test(s)) s = s.replace(',', '.');
  else if (/^-?[\d,]+\.\d+$/.test(s)) s = s.replace(/,/g, '');
  else s = s.replace(',', '.');
  if (!/^-?\d*\.?\d+(e-?\d+)?$/i.test(s)) return null;
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
/* quantité : accepte 12,5 ou 12*3,5+4 */
function parseQty(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).trim().replace(/\s/g, '').replace(/,/g, '.').replace(/x/gi, '*');
  if (!s) return null;
  if (/^[\d.]+$/.test(s)) return parseFloat(s);
  if (!/^[\d.+\-*/()]+$/.test(s)) return null;
  try { const r = Function('"use strict";return (' + s + ')')(); return isFinite(r) ? r : null; } catch (e) { return null; }
}
const NF2 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const NF0 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
const NFq = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 3 });
const eur = v => v === null || v === undefined || !isFinite(v) ? '' : NF2.format(v);
const eur0 = v => v === null || v === undefined || !isFinite(v) ? '' : NF0.format(v);
const qty = v => v === null || v === undefined || !isFinite(v) ? '' : NFq.format(v);
const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const MOISL = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const mI = m => { const [y, mo] = m.split('-').map(Number); return y * 12 + mo - 1; };
const mS = i => `${Math.floor(i / 12)}-${String(i % 12 + 1).padStart(2, '0')}`;
const mFmt = m => m ? `${MOIS[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}` : '';
const mFmtL = m => m ? `${MOISL[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}` : '';
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
/* lit un mois depuis « 2026-07 », « 07/2026 », « 15/07/2026 », « juillet 2026 », un nombre de série Excel ou une Date */
function parseMonth(v) {
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, '0')}`;
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`; }
  const s = String(v).trim().toLowerCase();
  let m;

  const X = v => L + (v - x0) / (x1 - x0) * (W - L - R), Y = v => Tp + (1 - (v - y0) / (y1 - y0)) * (H - Tp - B);
  const ticks = []; const step = niceStep((y1 - y0) / 4);
  for (let v = Math.ceil(y0 / step) * step; v <= y1; v += step) ticks.push(`<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line2)"/><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${eur0(v)}</text>`);
  const yrs = []; for (let y = Math.ceil(x0 / 12); y * 12 <= x1; y++) yrs.push(`<line x1="${X(y * 12)}" x2="${X(y * 12)}" y1="${Tp}" y2="${H - B}" stroke="var(--line2)"/><text x="${X(y * 12)}" y="${H - 8}" text-anchor="middle">${y}</text>`);
  const ref = r.pu !== null ? `<line x1="${L}" x2="${W - R}" y1="${Y(r.pu)}" y2="${Y(r.pu)}" stroke="var(--med)" stroke-dasharray="4 3"/><text x="${W - R}" y="${Y(r.pu) - 4}" text-anchor="end" style="fill:var(--med)">${STATNAME[r.mode] || ''} ${eur(r.pu)}</text>` : '';
  const used = new Set(r.used);
  const dots = pts.map(o => `<circle cx="${X(mI(o.m0))}" cy="${Y(o.rev)}" r="4" fill="${used.has(o) ? 'var(--dot)' : 'var(--panel)'}" stroke="${used.has(o) ? 'var(--dot)' : 'var(--dot2)'}" stroke-width="1.5"><title>${esc(o.ent)} · ${esc(o.op)} · ${mFmt(o.m0)} · ${eur(o.pu)} → ${eur(o.rev)} €</title></circle>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Prix relevés revalorisés selon leur date de valeur">${ticks.join('')}${yrs.join('')}${ref}${dots}</svg></div>`;
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x || 1))); const f = x / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }

  $('#btnSave').addEventListener('click', e => { e.stopPropagation(); $('#saveMenu').hidden = !$('#saveMenu').hidden; });
  document.addEventListener('click', () => { $$('.menu').forEach(m => { m.hidden = true; }); });
  $('#saveMenu').addEventListener('click', e => {

/* ---------- Sauvegarde complète ---------- */
async function exportBackup() {
  await Store.flushAll();
  const o = { app: 'TerraEstim', version: 1, date: new Date().toISOString() };
  for (const c of COLS) o[c] = Object.fromEntries(st.data[c]);
  download(`TerraEstim - sauvegarde ${new Date().toISOString().slice(0, 10)}.json`, new Blob([JSON.stringify(o, null, 1)], { type: 'application/json' }));
}
async function restoreBackup(f) {
  try {
    const o = JSON.parse(await f.text());
    if (o.app !== 'TerraEstim') throw new Error('ce fichier n\'est pas une sauvegarde TerraEstim');
    /* sauvegarde antérieure à la nomenclature TerraSuite : renumérotée avant d'être restaurée */
    for (const c of COLS) o[c] = o[c] || {};
    if (!(o.settings.main && o.settings.main.nomenclature === NOMEN_V)) { const keepMain = !o.settings.main; migrateLots(o); if (keepMain) delete o.settings.main; }
    let n = 0;
    for (const c of COLS) for (const [id, v] of Object.entries(o[c] || {})) { Store.put(c, id, v, 50 + n); n++; }
    setStatus(`${n} éléments restaurés`, 'ok');
    renderAll();
  } catch (e) { setStatus('Restauration impossible : ' + e.message, 'err'); }
}

function libList(all = false) {
  const q = norm(st.libQ), t = toks(st.libQ);
  const out = [];
  for (const [id, p] of st.data.prestations) {
    if (!all && st.libLot && (p.lot || '') !== st.libLot) continue;
    if (!all && q) { const h = norm(p.code + ' ' + p.designation + ' ' + (p.description || '')); if (!h.includes(q) && ![...t].every(w => h.includes(w))) continue; }
    const r = refPrice(id);
    if (!all && st.libOnlyPriced && (!r || r.pu === null)) continue;
    out.push({ id, p, r });
  }
  const order = new Map(lots().map((l, i) => [l.code, i]));
  out.sort((a, b) => ((order.get(a.p.lot) ?? 999) - (order.get(b.p.lot) ?? 999)) || String(a.p.code).localeCompare(String(b.p.code), 'fr', { numeric: true }));

}

function bindLibSide() {

    for (const [eid, e] of st.data.estimations) if ((e.lignes || []).some(l => l.pid === id)) { e.lignes.forEach(l => { if (l.pid === id) { l.pid = ''; } }); Store.put('estimations', eid, e); }
    Store.del('prestations', id); st.libSel = null; st.confirm = null; renderAll();
  };
  attachAC($('#pMerge'), { lot: p.lot, onPick: tid => {
    if (!tid || tid === id) return;

}
/* rattache tout ce qui pointait sur « from » à « to », puis supprime « from » */
function mergePrestation(from, to) {
  for (const [sid, s] of st.data.sources) if ((s.lignes || []).some(l => l.pid === from)) { s.lignes.forEach(l => { if (l.pid === from) l.pid = to; }); Store.put('sources', sid, s); }
  for (const [eid, e] of st.data.estimations) if ((e.lignes || []).some(l => l.pid === from)) { e.lignes.forEach(l => { if (l.pid === from) l.pid = to; }); Store.put('estimations', eid, e); }
  const a = P(from), b = P(to);
  if (a && b && !b.description && a.description) { b.description = a.description; Store.put('prestations', to, b); }
  if (a && b && !artOf(to) && artOf(from)) setArt(to, artOf(from));
  Store.del('prestations', from);
}

const ROLES = { '': '—', num: 'N° / article', des: 'Désignation', desx: 'Désignation (suite)', unit: 'Unité', qte: 'Quantité', pu: 'Prix unitaire', tot: 'Montant' };

function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return Promise.reject(new Error('la bibliothèque Excel n\'a pas pu être chargée (connexion internet nécessaire)'));

async function startImport(f) {
  setStatus('Lecture de ' + f.name + '…');
  try {
    if (/\.(csv|tsv|txt)$/i.test(f.name)) { const t = await f.text(); return startImportText(t, f.name); }
    await loadXLSX();

    list.innerHTML = items.map((x, i) => `<button type="button" data-i="${i}">${esc(x.p.nom)}<small>${esc([x.p.fabricant, x.p.reference, x.p.sous].filter(Boolean).join(' · '))}</small></button>`).join('') || '<button type="button" disabled>Aucun produit trouvé</button>';
  };

/* Un article (type « art ») décrit un ouvrage : texte de prescription, normes, mode de métré, produits de référence TerraDocs.

   Une prestation de la bibliothèque est rattachée à un article (p.article) ; plusieurs prestations, donc plusieurs lignes de DPGF, peuvent renvoyer au même article.
   Les rattachements fournis avec les données de départ sont dans article.seedPids : ils valent tant que la prestation n'a pas été rattachée à la main. */
const AR = id => st.data.articles.get(id);
const codeCmp = (a, b) => String(a || '').localeCompare(String(b || ''), 'fr', { numeric: true });
/* ---------- Recueils d'articles ----------
   La bibliothèque type (recueil « ») et les CCTP de projet (recueil = identifiant du projet, ex. « ctn »).
   Un article de projet porte a.cctp (recueil) et a.piece (pièce du dossier : lot 01, 04A, 6B…), son numéro reprend celui du document (04A.3.1.2.1).
   Une prestation a un article par recueil : p.article (bibliothèque) et p.arts[recueil] (projets). */
const rcOf = a => (a && a.cctp) || '';
function recueils() {
  const meta = (st.data.settings.get('recueils') || {}).list || [];
  const out = meta.map(r => ({ ...r }));
  for (const a of st.data.articles.values()) if (a.cctp && !out.some(r => r.id === a.cctp)) out.push({ id: a.cctp, nom: 'CCTP ' + a.cctp.toUpperCase(), pieces: {} });
  return out;
}
const recueil = id => recueils().find(r => r.id === id) || null;
const rcName = id => id ? (recueil(id) || { nom: id }).nom : 'Bibliothèque type';
const rcShort = id => id ? ((recueil(id) || {}).court || id.toUpperCase()) : 'Bibliothèque';

function pieceName(rc, pc) { const r = recueil(rc), m = r && r.pieces && r.pieces[pc]; return m ? m.nom : (pc ? 'Lot ' + pc : 'Sans pièce'); }
/* prestations d'un recueil de projet : celles des DPGF du projet et des estimations qui l'utilisent */
function rcPrest(rc) {
  const r = recueil(rc), set = new Set();
  if (!r) return set;
  const src = new Set(r.sources || []);
  for (const [sid, x] of st.data.sources) if (src.has(sid) || (r.noteRe && new RegExp(r.noteRe).test(x.note || ''))) for (const l of x.lignes || []) if (l.pid) set.add(l.pid);
  for (const e of st.data.estimations.values()) if ((e.cctp || '') === rc) for (const l of e.lignes || []) if (l.pid) set.add(l.pid);
  for (const a of st.data.articles.values()) if (rcOf(a) === rc) for (const pid of a.seedPids || []) set.add(pid);
  return set;
}
function seedArtMap(rc = '') {
  if (!st.artCache) st.artCache = new Map();
  if (st.artCache.has(rc)) return st.artCache.get(rc);
  const m = new Map();
  for (const [aid, a] of st.data.articles) if (rcOf(a) === rc) for (const pid of a.seedPids || []) if (!m.has(pid)) m.set(pid, aid);
  st.artCache.set(rc, m);
  return m;
}
/* article d'une prestation dans un recueil */
function artOf(pid, rc = '') {
  const p = P(pid); if (!p) return '';
  const own = rc ? (p.arts && p.arts[rc] !== undefined ? p.arts[rc] : undefined) : p.article;
  const aid = own !== undefined ? own : seedArtMap(rc).get(pid) || '';
  return aid && AR(aid) && rcOf(AR(aid)) === rc ? aid : '';
}
/* rattache (ou détache, aid vide) une prestation ; le recueil est celui de l'article */
function setArt(pid, aid, rc = '') {
  const p = P(pid); if (!p) return;
  if (aid && AR(aid)) rc = rcOf(AR(aid));
  if (rc) p.arts = { ...(p.arts || {}), [rc]: aid || '' }; else p.article = aid || '';
  Store.put('prestations', pid, p);
}
/* article d'une ligne d'estimation : choisi sur la ligne, sinon celui de la prestation dans le recueil de l'estimation */
function lineArt(l, rc = '') {
  if (l.article && AR(l.article) && rcOf(AR(l.article)) === rc) return l.article;
  if (l.article === '-') return '';
  return l.pid ? artOf(l.pid, rc) : '';
}
/* prestations rattachées à un article */
function artPrest(aid) { const rc = rcOf(AR(aid)), out = []; for (const [pid] of st.data.prestations) if (artOf(pid, rc) === aid) out.push(pid); return out.sort((x, y) => codeCmp(P(x).code, P(y).code)); }
/* articles d'un recueil ; « lot » = lot de la bibliothèque, ou pièce pour un recueil de projet */
function artList(lot, rc = st.rc) {
  const out = Array.from(st.data.articles.entries()).filter(([, a]) => rcOf(a) === rc && (!lot || (rc ? a.piece === lot : a.lot === lot))).map(([id, a]) => ({ id, a }));
  if (rc) { const po = pieceOrder(rc); const ix = p => { const i = po.indexOf(p); return i < 0 ? 999 : i; }; return out.sort((x, y) => (ix(x.a.piece) - ix(y.a.piece)) || codeCmp(x.a.code, y.a.code)); }
  const order = new Map(lots().map((l, i) => [l.code, i]));

}
/* chapitres parents d'un article (codes préfixes, même recueil) */
function artParents(a) {
  const parts = String(a.code || '').split('.'), out = [], rc = rcOf(a);
  for (let i = parts.length - 1; i >= 1; i--) {
    const c = parts.slice(0, i).join('.');
    for (const [id, x] of st.data.articles) if (x.code === c && rcOf(x) === rc && (rc || x.lot === a.lot)) { out.unshift(id); break; }
  }
  return out;
}
const artLabel = a => a ? `${a.code} ${a.titre}` : '';
function nextArtCode(lot, parent, rc = '', piece = '') {
  const pre = parent ? parent + '.' : ((rc ? piece : lot) || '00') + '.';
  let mx = 0;
  for (const a of st.data.articles.values()) if (rcOf(a) === rc && (rc || a.lot === lot) && String(a.code || '').startsWith(pre)) { const r = a.code.slice(pre.length); if (/^\d+$/.test(r)) mx = Math.max(mx, +r); }
  return pre + (mx + 1);
}
function newArticle(o) {
  const id = uid();
  const rc = o.cctp !== undefined ? o.cctp : st.rc;
  const piece = rc ? (o.piece || '') : '';
  const a = { type: o.type || 'art', code: o.code || nextArtCode(o.lot, o.parent, rc, piece), lot: o.lot || '', titre: o.titre || (o.type === 'chap' ? 'Nouveau chapitre' : 'Nouvel article'), texte: o.texte || '', normes: o.normes || '', metre: o.metre || '', unite: o.unite || '', produits: o.produits || [], seedPids: [], created: Date.now() };

  Store.put('articles', id, a, 50);
  return id;
}
function searchArt(q, lot, n = 12, onlyArt = true, rc = '') {
  const nq = norm(q), t = toks(q), out = [];
  for (const [id, a] of st.data.articles) {
    if (onlyArt && a.type === 'chap') continue;
    if (rcOf(a) !== rc) continue;
    const hay = norm(a.code + ' ' + a.titre + ' ' + (a.texte || '').slice(0, 300));
    let s = 0;
    if (!nq) s = 0.5; else if (norm(a.code + ' ' + a.titre).includes(nq)) s = 1; else { let k = 0; for (const w of t) if (hay.includes(w)) k++; s = t.size ? k / t.size * 0.9 : 0; }
    if (s < 0.5) continue;
    if (lot && a.lot === lot) s += 0.1;
    out.push({ id, s });
  }
  return out.sort((x, y) => y.s - x.s || codeCmp(AR(x.id).code, AR(y.id).code)).slice(0, n);
}
/* liste déroulante de recherche d'articles ; onPick(id) */
function attachArtAC(input, { lot = '', onPick, allowNew = false, rc = '' }) {
  const wrap = input.parentElement; wrap.classList.add('ac');
  let list = null, items = [], on = -1;
  const close = () => { if (list) { list.remove(); list = null; } on = -1; };
  const draw = () => {
    items = searchArt(input.value, lot, 12, true, rc);
    if (!list) { list = document.createElement('div'); list.className = 'acl'; wrap.appendChild(list); }
    const rows = items.map((it, i) => { const a = AR(it.id); return `<button type="button" data-i="${i}" class="${i === on ? 'on' : ''}">${esc(a.code)} · ${esc(a.titre)}<small>${rc ? esc(pieceName(rc, a.piece)) : esc(lotName(a.lot))}${a.unite ? ' · ' + esc(a.unite) : ''}</small></button>`; });
    if (allowNew && input.value.trim()) rows.push(`<button type="button" data-i="new" class="${on === items.length ? 'on' : ''}">Nouvel article « ${esc(input.value.trim())} »<small>${rc ? 'Créé dans ' + esc(rcName(rc)) : 'Créé dans le lot ' + esc(lot || '')}, texte à rédiger</small></button>`);
    if (!rows.length) rows.push(`<button type="button" disabled>Aucun article trouvé</button>`);
    list.innerHTML = rows.join('');
  };
  const pick = i => { const v = input.value.trim(); close(); if (i === 'new') onPick(newArticle({ lot, titre: v, cctp: rc, piece: rc ? (pieceOrder(rc).find(p => (recueil(rc).pieces[p] || {}).lot === lot) || '') : '' })); else if (items[i]) onPick(items[i].id); };
  input.addEventListener('input', () => { on = -1; draw(); });
  input.addEventListener('focus', draw);
  input.addEventListener('blur', () => setTimeout(close, 150));
  input.addEventListener('keydown', e => {
    const max = items.length + (allowNew && input.value.trim() ? 1 : 0);
    if (e.key === 'ArrowDown') { e.preventDefault(); on = Math.min(max - 1, on + 1); draw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); on = Math.max(0, on - 1); draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (on >= 0) pick(on === items.length ? 'new' : on); else if (items.length) pick(0); }
    else if (e.key === 'Escape') close();
  });
  wrap.addEventListener('mousedown', e => { const b = e.target.closest('.acl button[data-i]'); if (b) { e.preventDefault(); pick(b.dataset.i === 'new' ? 'new' : +b.dataset.i); } });
}

/* ---------- Produits TerraDocs ---------- */
/* Hors ligne, TerraEstim et TerraDocs ouverts depuis le dossier partagent le stockage du navigateur : les produits sont lus directement.
   Sinon, un export JSON de TerraDocs peut être chargé ; une copie est gardée dans la base (réglage « terradocs »). */
/* depuis la nomenclature TerraSuite (0.15), les lots de TerraEstim et de TerraDocs ont les mêmes codes */
function docsData() {
  let live = null;
  try { const s = localStorage.getItem('terradocs.v1'); if (s) { const d = JSON.parse(s); if (d && Array.isArray(d.produits)) live = d; } } catch (e) {}
  if (live) return { src: 'live', lots: live.lots || [], produits: live.produits };
  const c = st.data.settings.get('terradocs');
  if (c && Array.isArray(c.produits)) return { src: 'copie', date: c.date, lots: c.lots || [], produits: c.produits };
  return { src: '', lots: [], produits: [] };
}
function docsLotOf(d, p) { const l = (d.lots || []).find(x => x.id === p.lot); return l ? l.code : ''; }
function searchDocs(q, lot, all) {
  const d = docsData(), words = norm(q).split(/\s+/).filter(Boolean), dl = lot || '';
  const out = [];
  for (const p of d.produits) {
    const pl = docsLotOf(d, p);
    if (!all && dl && pl && pl !== dl && !words.length) continue;
    const hay = norm([p.nom, p.fabricant, p.reference, p.sous, (p.tags || []).join(' '), p.perf].join(' '));
    if (words.length && !words.every(w => hay.includes(w))) continue;
    out.push({ p, s: (pl === dl ? 1 : 0) + (p.statut === 'prescrit' ? 0.5 : 0) + (p.fav ? 0.3 : 0) });
  }
  return out.sort((a, b) => b.s - a.s || String(a.p.nom).localeCompare(b.p.nom, 'fr')).slice(0, 15);
}
const slimDoc = p => ({ id: p.id, nom: p.nom || '', fabricant: p.fabricant || '', reference: p.reference || '', url: ((p.liens || []).find(l => l.type === 'site' && l.url) || (p.liens || []).find(l => l.url) || {}).url || '', ft: ((p.liens || []).find(l => l.type === 'ft' && l.url) || {}).url || '' });
/* lien vers la fiche TerraDocs (hors ligne) ou la page du fabricant */
function docHref(x) { return location.protocol === 'file:' ? `../TerraDocs/TerraDocs.html#p=${encodeURIComponent(x.id)}` : (x.url || ''); }
/* produits d'un article ; à défaut, ceux de l'article de la bibliothèque type de la prestation */
function artDocs(aid, pid) {
  const A = aid && AR(aid); let list = (A && A.produits) || [];
  if (!list.length && pid && P(pid)) { const t = artOf(pid, ''); const T = t && AR(t); if (T && T.produits) list = T.produits; }
  return list;
}
function docLinks(list, max = 4) {
  if (!list || !list.length) return '';
  const a = list.slice(0, max).map(x => { const h = docHref(x); const t = esc([x.fabricant, x.reference].filter(Boolean).join(' · ') || x.nom); return h ? `<a href="${esc(h)}" target="_blank" rel="noopener" title="${esc(x.nom)} : ${location.protocol === 'file:' ? 'fiche TerraDocs' : 'page du fabricant'}">${t}</a>` : `<span class="tag mut">${t}</span>`; });
  if (list.length > max) a.push(`<span class="muted" style="font-size:11px">+${list.length - max}</span>`);
  return a.join('');
}
/* produits TerraDocs proposés pour un article : même lot, mots du titre */
const STOPW = new Set('pour avec sans dans des les une sur aux par et ou en de du la le au ouvrages ouvrage divers diverses sujétions lot travaux mise œuvre oeuvre'.split(' '));
function suggestDocs(a) {
  const d = docsData(); if (!d.produits.length) return [];
  const dl = a.lot || '', words = norm(a.titre + ' ' + (a.texte || '').slice(0, 300)).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOPW.has(w));
  const tw = new Set(norm(a.titre).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOPW.has(w)));
  const have = new Set((a.produits || []).map(x => x.id)), out = [];
  for (const p of d.produits) {
    if (have.has(p.id)) continue;
    const pl = docsLotOf(d, p); if (dl && pl && pl !== dl) continue;
    const hay = norm([p.nom, p.reference, p.sous, (p.tags || []).join(' ')].join(' '));
    let sc = 0; for (const w of new Set(words)) if (hay.includes(w.slice(0, Math.max(5, w.length - 2)))) sc += tw.has(w) ? 3 : 1;
    if (sc < 3) continue;
    out.push({ p, s: sc + (p.statut === 'ref' ? 0.2 : 0) + (p.fav ? 0.5 : 0) });
  }
  return out.sort((x, y) => y.s - x.s).slice(0, 6).map(x => x.p);

/* mise à jour des copies de produits gardées dans les articles quand TerraDocs a changé */
function docsRefresh(a) {
  const d = docsData(); if (d.src !== 'live') return false;
  let ch = false;
  (a.produits || []).forEach((x, i) => { const p = d.produits.find(q => q.id === x.id); if (p) { const s = slimDoc(p); if (JSON.stringify(s) !== JSON.stringify(x)) { a.produits[i] = s; ch = true; } } });
  return ch;
}
async function importDocsFile(f) {
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.produits)) throw new Error('ce fichier n\'est pas un export TerraDocs');
    const prod = d.produits.map(p => ({ ...slimDoc(p), lot: p.lot || '', sous: p.sous || '', statut: p.statut || '', fav: !!p.fav, tags: p.tags || [], perf: p.perf || '', liens: (p.liens || []).filter(l => l.url).slice(0, 4).map(l => ({ type: l.type, url: l.url })) }));
    Store.put('settings', 'terradocs', { date: new Date().toISOString().slice(0, 10), lots: (d.lots || []).map(l => ({ id: l.id, code: l.code, nom: l.nom })), produits: prod });
    setStatus(`${prod.length} produits TerraDocs chargés`, 'ok'); renderAll();
  } catch (e) { setStatus('Chargement impossible : ' + e.message, 'err'); }

/* ---------- Onglet CCTP ---------- */
function renderCctp() {
  const v = $('#view');
  const q = norm(st.artQ), t = toks(st.artQ);
  const rc = st.rc, RCS = recueils();

  let list = artList(st.artLot);
  const nP = new Map(); for (const [pid] of st.data.prestations) { const a = artOf(pid, rc); if (a) nP.set(a, (nP.get(a) || 0) + 1); }

  const genA = a => { if (!rc) return false; const g = (((recueil(rc) || {}).pieces || {})[a.piece] || {}).gen || []; return g.includes(String(a.code).split('.')[1]); };
  if (st.artEmpty) list = list.filter(({ id, a }) => a.type !== 'chap' && !nP.get(id) && !genA(a));
  const lotOpts = rc ? `<option value="">Toutes les pièces</option>` + pieceOrder(rc).map(p => `<option value="${esc(p)}"${st.artLot === p ? ' selected' : ''}>${esc(pieceName(rc, p))}</option>`).join('')
    : `<option value="">Tous les lots</option>` + lots().map(l => `<option value="${esc(l.code)}"${st.artLot === l.code ? ' selected' : ''}>${esc(l.code + ' ' + l.nom)}</option>`).join('');
  const nArt = list.filter(x => x.a.type !== 'chap').length;
  let sansArt = 0;
  if (rc) { const pieceLots = st.artLot ? new Set(list.map(x => x.a.lot)) : null; for (const pid of rcPrest(rc)) if (P(pid) && !artOf(pid, rc) && (!pieceLots || pieceLots.has(P(pid).lot))) sansArt++; }
  else for (const [pid] of st.data.prestations) if (!artOf(pid) && (!st.artLot || P(pid).lot === st.artLot)) sansArt++;
  const rcOpts = [{ id: '', nom: 'Bibliothèque type' }, ...RCS].map(r => `<option value="${esc(r.id)}"${rc === r.id ? ' selected' : ''}>${esc(r.id ? 'CCTP ' + r.nom : r.nom)}</option>`).join('');
  const tb = `<div class="toolbar">
    <select id="artRc" title="Recueil d'articles : bibliothèque type ou CCTP d'un projet" style="max-width:300px">${rcOpts}</select>
    <input type="search" id="artQ" placeholder="Rechercher un article" value="${esc(st.artQ)}" style="width:220px">
    <select id="artLot" style="max-width:260px">${lotOpts}</select>
    <label class="chk"><input type="checkbox" id="artEmpty"${st.artEmpty ? ' checked' : ''}> Sans prestation</label>
    <span class="sep"></span>
    <button class="btn" id="artAddC">+ Chapitre</button><button class="btn" id="artAdd">+ Article</button>
    <span class="grow"></span>
    <span class="hint">${nArt} article${nArt > 1 ? 's' : ''} · ${sansArt} prestation${sansArt > 1 ? 's' : ''} sans article</span>
    <div class="expwrap"><button class="btn" id="artExp" aria-haspopup="true">Exporter ▾</button>
      <div class="menu" id="artMenu" hidden role="menu">
        <button data-x="docx" role="menuitem"><b>${rc ? 'CCTP ' + esc(rcShort(rc)) : 'CCTP de la bibliothèque'}</b> (.docx)<span>${rc ? (st.artLot ? esc(pieceName(rc, st.artLot)) : 'Toutes les pièces') : st.artLot ? 'Lot ' + esc(lotName(st.artLot)) : 'Tous les lots'} : chapitres, articles, produits de référence</span></button>
        <button data-x="sans" role="menuitem"><b>Prestations sans article</b> (.xlsx)<span>Liste à rattacher</span></button>
        <button data-x="docs" role="menuitem"><b>Charger un export TerraDocs</b> (.json)<span>${docsData().src === 'live' ? 'Inutile ici : TerraDocs est lu directement' : 'Pour proposer ses produits dans les articles'}</span></button>
      </div></div>
  </div>`;

    v.innerHTML = tb + `<div class="empty"><h2>Aucun article de CCTP</h2><p>Chaque article décrit un ouvrage (matériaux, mise en œuvre, normes, mode de métré). Les prestations de la bibliothèque, donc les lignes des estimations et des DPGF, y sont rattachées.</p><button class="btn pri" id="emArt">Créer un article</button></div>`;

      <td class="mono">${esc(a.unite || '')}</td>

  }

    <aside class="side" id="artSide">${artSide()}</aside></div>`;
  bindCctpTb();
  $$('#view tr.row').forEach(tr => tr.addEventListener('click', () => { st.artSel = tr.dataset.id; st.confirm = null; renderAll(); }));
  if (st.artScroll) { st.artScroll = false; const r = $('#view tr.row.sel'); if (r) later(() => r.scrollIntoView({ block: 'center' })); }
  bindArtSide();
}
function bindCctpTb() {

  function style() { if (document.getElementById('ori-css')) return; const s = document.createElement('style'); s.id = 'ori-css'; s.textContent = CSS; document.head.appendChild(s); }
  /* cfg : { titre, lead, reprendre:{t,s,go}, actions:[{ic,t,s,go,pri}], liste:{titre,items:[{c,t,s,go}],vide,recherche}, projets:{titre,items:[{c,t,boutons:[{t,go}]}],vide}, etapes:[html], pied } */
  function render(el, cfg) {
    style(); const fns = []; const f = fn => { fns.push(fn); return fns.length - 1; };
    const L = cfg.liste, P = cfg.projets;
    const pjHtml = P ? `<div class="ori-box"><h2>${E(P.titre || 'Projets de l\'agence')}</h2><div class="ori-pj">${P.items.map(p => `<div class="row"><span class="t">${p.c ? `<b>${E(p.c)}</b> · ` : ''}${E(p.t)}</span>${p.boutons.map(b => `<button data-of="${f(b.go)}">${E(b.t)}</button>`).join('')}</div>`).join('') || `<div class="ori-empty">${E(P.vide || 'Aucun projet en cours.')}</div>`}</div></div>` : '';
    const listHtml = items => items.map(x => `<li><button data-of="${f(x.go)}">${x.c !== undefined ? `<span class="c">${E(x.c)}</span>` : ''}<span class="t">${E(x.t)}</span>${x.s ? `<span class="s">${E(x.s)}</span>` : ''}</button></li>`).join('');
    el.innerHTML = `<div class="ori-scroll" style="height:100%;max-height:100%;overflow:auto;width:100%"><div class="ori${cfg.compact ? ' compact' : ''}">
      <div><h1>${E(cfg.titre)}</h1>${cfg.lead ? `<p class="lead">${cfg.lead}</p>` : ''}</div>
      ${cfg.reprendre ? `<button class="ori-resume" data-of="${f(cfg.reprendre.go)}">${svg('play')}<span><span class="k">Reprendre</span><b>${E(cfg.reprendre.t)}</b>${cfg.reprendre.s ? `<span class="s">${E(cfg.reprendre.s)}</span>` : ''}</span></button>` : ''}
      <div><h2>Que voulez-vous faire ?</h2><div class="ori-acts">${cfg.actions.map(a => `<button class="ori-act${a.pri ? ' pri' : ''}" data-of="${f(a.go)}"><span class="ic">${svg(a.ic)}</span><span><b>${E(a.t)}</b><span>${E(a.s || '')}</span></span></button>`).join('')}</div></div>
      <div class="ori-cols"><div>${L ? `<div class="ori-box"><h2>${E(L.titre)} ${L.items.length ? `<span style="font-weight:400">(${L.items.length})</span>` : ''}</h2>${L.recherche && L.items.length > 6 ? '<input type="search" class="ori-q" placeholder="Rechercher…" aria-label="Rechercher dans la liste">' : ''}<ul class="ori-ul">${listHtml(L.items) || `<li class="ori-empty">${E(L.vide || 'Rien pour le moment.')}</li>`}</ul></div>` : pjHtml}${cfg.extra || ''}</div>
        <div>${L ? pjHtml : ''}
          ${cfg.etapes ? `<div class="ori-box"><h2>Comment ça marche</h2><ol class="ori-steps">${cfg.etapes.map(s => `<li>${s}</li>`).join('')}</ol></div>` : ''}
          ${cfg.pied ? `<p class="ori-foot">${cfg.pied}</p>` : ''}</div></div></div></div>`;
    el.querySelectorAll('[data-of]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); const fn = fns[+b.dataset.of]; if (fn) fn(); }));
    const q = el.querySelector('.ori-q'); if (q) q.addEventListener('input', () => { const v = q.value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); el.querySelectorAll('.ori-ul li').forEach(li => { li.hidden = v && !li.textContent.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(v); }); });
  }
  const date = t => { if (!t) return ''; const d = new Date(t); return isNaN(d) ? '' : d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }); };
  return { render, date, svg };
})();

/* ================= Accueil de TerraEstim : que faire en arrivant ================= */
function goTab(t) { st.imp = null; st.tab = t; st.confirm = null; try { localStorage.setItem('te-tab', t); } catch (e) {} renderAll(); }
function renderHome() {
  const ests = [...st.data.estimations].sort((a, b) => (b[1].updated || 0) - (a[1].updated || 0));
  let last = null; try { last = localStorage.getItem('te-est'); } catch (e) {}
  const le = (last && st.data.estimations.get(last)) ? [last, st.data.estimations.get(last)] : ests[0];
  const pc = e => { const p = projOf(e); return p ? p.code || '' : ''; };
  const openEst = id => { st.estSel = id; st.estLine = null; goTab('est'); };
  const nP = st.data.prestations.size, nS = st.data.sources.size, nA = [...st.data.articles.values()].filter(a => a.type !== 'chap').length;
  Ori.render($('#view'), {
    titre: 'TerraEstim',
    lead: 'Base de prix tirée des DPGF de vos appels d\'offres, revalorisée par les index BT ; estimations par lot ou par lot du marché ; CCTP et DPGF reliés ligne à ligne. Choisissez ce que vous voulez faire.',
    reprendre: le ? { t: le[1].title || 'Estimation', s: [String(le[1].title || '').startsWith(pc(le[1])) ? '' : pc(le[1]), le[1].phase, eur(computeEst(le[1]).ht2) + ' € HT'].filter(Boolean).join(' · '), go: () => openEst(le[0]) } : null,
    actions: [
      { ic: 'plus', pri: true, t: 'Nouvelle estimation', s: 'Prestations de la base, vos quantités, prix revalorisés au mois choisi ; rattachée à un projet.', go: () => { st.estSel = newEstimation(); goTab('est'); } },
      { ic: 'up', t: 'Importer une DPGF', s: 'Offre d\'une entreprise (Excel, CSV) : ses prix alimentent la base, ligne par ligne.', go: () => $('#fileIn').click() },
      { ic: 'doc', t: 'Rédiger un CCTP', s: 'Articles de la bibliothèque type ou d\'un CCTP de projet, export Word par lot.', go: () => goTab('cctp') },
      { ic: 'search', t: 'Chercher un prix', s: `${nP} prestations, prix médians des offres reçues, revalorisés.`, go: () => { goTab('lib'); later(() => { const q = $('#libQ'); if (q) q.focus(); }); } },
      { ic: 'chart', t: 'Index et réglages', s: 'Index BT et TP, mois de valeur, lots de la nomenclature, mode de calcul des prix.', go: () => goTab('idx') },
      { ic: 'save', t: 'Sauvegarder la base', s: 'Tout exporter en un fichier .json (à refaire régulièrement, ou pour l\'autre poste).', go: () => exportBackup() }
    ],
    liste: { titre: 'Vos estimations', recherche: true, vide: 'Aucune estimation : créez-en une, ou ouvrez celle d\'un projet.', items: ests.map(([id, e]) => ({ c: pc(e), t: e.title || 'Estimation', s: [e.phase, e.updated ? Ori.date(e.updated) : ''].filter(Boolean).join(' · '), go: () => openEst(id) })) },
    projets: TSP_OK() ? { titre: 'Projets de l\'agence', vide: 'Aucun projet : créez-les dans TerraContacts, onglet Projets.', items: st.projets.filter(p => p.statut !== 'archive' && p.statut !== 'termine').map(p => ({ c: p.code, t: p.nom, boutons: [{ t: 'Estimation', go: () => { location.hash = '#projet=' + p.id; } }, ...([...st.data.sources.values()].some(x => x.projet === p.id) ? [{ t: 'DPGF', go: () => { location.hash = '#dpgf=' + p.id; } }] : [])] })) } : null,
    etapes: ['<b>Importez les DPGF</b> reçues en appel d\'offres : elles remplissent la base de prix.', '<b>Rattachez</b> les lignes aux prestations types (proposé automatiquement, à vérifier).', '<b>Estimez</b> : prestations et quantités par lot ; les prix sont revalorisés au mois choisi.', '<b>Projet</b> : lots du marché et entreprises, partagés avec TerraPlanning et TerraChantier.', '<b>Exportez</b> l\'estimatif (Excel, PDF), la DPGF vierge et le CCTP Word.'],
    pied: `Base : ${nP} prestations, ${nS} DPGF importées, ${nA} articles de CCTP. Enregistrée dans ce navigateur : « Sauvegarde » pour l'exporter.` + (typeof TSA !== 'undefined' ? '<br>' + TSA.pied() : '')
  });
}
/* ================= Démarrage ================= */
/* lien direct vers un article : TerraEstim.html#art=identifiant (depuis TerraDocs) */
function goArt(id, render = true) {
  if (!id || !AR(id)) return;
  st.tab = 'cctp'; st.artSel = id; st.artQ = ''; st.artLot = ''; st.artEmpty = false; st.rc = rcOf(AR(id)); st.artScroll = true;
  try { localStorage.setItem('te-rc', st.rc); } catch (e) {}
  if (render) renderAll();
}
function openFromHash() {
  const m = location.hash.match(/[#&]art=([^&]+)/); if (!m) return;
  const id = decodeURIComponent(m[1]); if (!AR(id)) return;
  st.imp = null; goArt(id, false);
}
window.addEventListener('hashchange', async () => { openFromHash(); await openProjetHash(); renderAll(); });
(function init() {
  try { st.T = localStorage.getItem('te-T'); st.tab = localStorage.getItem('te-tab') || 'lib'; st.rc = localStorage.getItem('te-rc') || ''; } catch (e) {}
  st.tab = 'home'; // on arrive toujours sur l'accueil (orientation) ; les liens directs (#est, #projet, #dpgf, #art) ouvrent leur vue
  if (!st.T) st.T = lastMonth('BT01') || today();

    const a = document.createElement('a'); a.href = '../terrasuite.html'; a.className = 'btn'; a.textContent = '← TerraSuite'; a.style.textDecoration = 'none'; a.style.color = 'inherit';

  Store.start(c => {
    const first = !st.loaded;

    if (c === 'prestations' || c === '*') st.tokCache.clear();

    if (first && !hasT) { const l = lastMonth(S().defIndex); if (l) st.T = l; }
    if (first) openFromHash();
    renderAll(first);
  }).then(async () => {
    let h = false;
    try { await loadProjets(); await initProjets(); initProjetsDpgf(); h = await openProjetHash(); renderAll();
      if (TSP_OK()) TSP.onChange(async () => { if (await loadProjets()) rerender(); }); } catch (e) { console.warn('projets', e); }
    if (h) return;
    if (Store.kind === 'local' && !Store.saveErr) setStatus([Store.lotMsg, Store.seedMsg].filter(Boolean).join(' · ') || 'Enregistrement dans ce navigateur uniquement', Store.seedMsg || Store.lotMsg ? 'ok' : ''); });
  window.TE = { st, Store, refPrice, computeEst, newPrestation, newEstimation, parseIndexText, buildLines, artOf, lineArt, newArticle, exportCctpDocx, docxBlob, cctpBody, recueils, rcPrest, artList };
})();
