<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TerraModel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* TerraModel : modeleur 3D de type pousser/tirer. Même famille visuelle que les autres applications TerraSuite, accent ocre. */
:root{
  --bg:#F0EEEA; --panel:#FFFFFF; --sunk:#F7F5F1; --ink:#22201C; --muted:#6A655C; --line:#DAD4CA; --line2:#E9E4DC;
  --accent:#8A5A12; --accent-ink:#FFFFFF; --accent-soft:#F3E6CF; --sel:#F6ECDA; --err:#B3261E; --ok:#2E6B3F;
  --view:#E6E9EB; --face:#F2EFE9; --back:#A9B7C6; --edge:#2A2723; --grid:#C9CDD0;
  --f-ui:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --f-cond:"IBM Plex Sans Condensed","Arial Narrow","IBM Plex Sans",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171614; --panel:#1F1D1A; --sunk:#1A1917; --ink:#ECE7DF; --muted:#A39C90; --line:#3A362F; --line2:#2C2925;
  --accent:#E0B062; --accent-ink:#1C1608; --accent-soft:#3A2F1C; --sel:#30281A; --err:#F08A80; --ok:#7CC48F;
  --view:#2A2D30; --face:#D9D5CE; --back:#6F8296; --edge:#141310; --grid:#43474B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#171614; --panel:#1F1D1A; --sunk:#1A1917; --ink:#ECE7DF; --muted:#A39C90; --line:#3A362F; --line2:#2C2925;
  --accent:#E0B062; --accent-ink:#1C1608; --accent-soft:#3A2F1C; --sel:#30281A; --err:#F08A80; --ok:#7CC48F;
  --view:#2A2D30; --face:#D9D5CE; --back:#6F8296; --edge:#141310; --grid:#43474B; color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%;min-height:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-cond);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand small{font-family:var(--f-ui);font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);font-size:12px}
.ver{font-family:var(--f-mono);font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 7px;letter-spacing:0;text-transform:none}
.grow{flex:1}
.grp{display:flex;gap:4px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--muted)} .btn:disabled{opacity:.45;cursor:default}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
a.btn{text-decoration:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#proj{max-width:260px}
html.ts-embed .brand small{display:none}
#bMenus{font-size:15px;padding:3px 10px}
/* dans TerraSuite sur téléphone : barre du haut sur une ligne, fichiers en plein écran seulement */
@media (max-width:760px), (max-height:560px){
  html.ts-embed .top{padding:5px 8px;gap:4px 6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  html.ts-embed .top::-webkit-scrollbar{display:none}
  html.ts-embed .brand, html.ts-embed #gFile, html.ts-embed .top .grow{display:none}
  html.ts-embed .status{flex:1;min-width:0}
  html.ts-embed .bar{padding:4px 8px;gap:6px;flex-wrap:nowrap}
  html.ts-embed .hint{flex:1 1 0} html.ts-embed #vcbL{display:none} html.ts-embed #vcb{width:110px}
  html.ts-embed .tools{gap:1px;padding:3px 4px} html.ts-embed .tb{width:36px;height:36px;flex:none}
  html.ts-embed .viewbar .btn{padding:2px 6px;font-size:11.5px}
}
.status{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.status.err{color:var(--err)} .status.ok{color:var(--ok)}
.work{flex:1;min-height:0;display:flex;position:relative}
.tools{display:flex;flex-direction:column;gap:3px;padding:8px 6px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
.tools .sep{height:1px;background:var(--line);margin:4px 2px}
.tb{width:40px;height:40px;border:1px solid transparent;border-radius:7px;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--ink);position:relative}
.tb:hover{border-color:var(--line)} .tb.on{background:var(--accent-soft);border-color:var(--accent)}
.tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tb kbd{position:absolute;right:2px;bottom:1px;font-family:var(--f-mono);font-size:9px;color:var(--muted)}
.view{position:relative;flex:1;min-width:0;background:var(--view)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.scenes{position:absolute;top:8px;left:8px;right:330px;pointer-events:none;display:flex;gap:3px;overflow-x:auto;scrollbar-width:thin;align-items:flex-start;z-index:1}
.stab{pointer-events:auto;display:inline-flex;align-items:center;flex:none;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);border-radius:6px 6px 0 0;border-bottom:2px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.12);font-size:12px}
.stab.on{background:var(--accent-soft);border-color:var(--accent);border-bottom-color:var(--accent)}
.stab button{border:0;background:transparent;cursor:pointer;padding:3px 9px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.stab .sact{padding:3px 5px;color:var(--muted)} .stab .sact:hover{color:var(--ink)}
.stab.sadd{padding:3px 9px;cursor:pointer;color:var(--muted);border-style:dashed} .stab.sadd:hover{color:var(--ink);border-color:var(--muted)}

.vpanel{position:absolute;top:44px;right:8px;bottom:8px;width:min(340px,calc(100% - 16px));overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px 10px;z-index:3;display:flex;flex-direction:column;gap:6px}
.vpanel .vhead{display:flex;align-items:center;justify-content:space-between}
#annot{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#annot .lbl{position:absolute;transform:translate(-50%,-50%);background:rgba(255,255,255,.88);border:1px solid #9aa3ad;border-radius:3px;padding:0 4px;font:12px/1.5 system-ui,sans-serif;color:#1d2733;white-space:nowrap}
#annot .lbl.dim{border-color:#2563eb;color:#1e40af} #annot.act .lbl{pointer-events:auto;cursor:pointer} #annot .lbl[hidden]{display:none}
.nivt{width:100%;border-collapse:collapse;font-size:13px} .nivt th,.nivt td{padding:2px 3px;border-bottom:1px solid var(--line);text-align:left} .nivt .num{text-align:right;white-space:nowrap} .nivt td:last-child{white-space:nowrap} .nivt input{width:100%;min-width:0;font:inherit;padding:2px 4px;border:1px solid var(--line);border-radius:4px}
#bCut.on{background:#fde2e2;border-color:#D02020}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px}
.sw{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 5px;cursor:pointer;font-size:11.5px;text-align:left;min-width:0}
.sw i{width:16px;height:16px;border-radius:3px;border:1px solid rgba(0,0,0,.25);flex:none} .sw span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .sw small{color:var(--muted)}
.sw.on{border-color:var(--accent);background:var(--accent-soft)} @media (max-width:760px){ #matP{max-height:40%} #matP .hint0:first-of-type{display:none} } #imgP .btn{text-align:left} input[type=color]{width:34px;height:26px;padding:0 2px;border:1px solid var(--line);border-radius:5px;background:var(--panel)}
.vpanel .r{display:flex;align-items:center;gap:5px;flex-wrap:wrap} .vpanel .grow{flex:1}
.btn.sm{padding:2px 7px;font-size:12px} .btn.danger{color:var(--err)}
#vplan{width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:crosshair;flex:none}
.vsel{min-height:30px;font-size:12px} .vsel .ic,.vsel svg{vertical-align:-2px}
.ctxbar{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:4px 6px 4px 12px;font-size:12.5px;display:flex;gap:8px;align-items:center;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.selbar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:2}
.imp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 16px));max-height:calc(100% - 20px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.25);padding:12px 14px;z-index:5;display:flex;flex-direction:column;gap:8px}
.imp h3{margin:0;font-family:var(--f-cond);font-size:14px} .imp p{margin:0} .imp .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .imp .grow{flex:1}
.impl{display:flex;flex-direction:column;gap:2px;max-height:200px;overflow:auto;border:1px solid var(--line2);border-radius:6px;padding:4px 8px} .impl small{color:var(--muted)}
@media (max-width:760px){ .selbar{bottom:auto;top:84px} }
.hint0{color:var(--muted);font-size:11.5px}
.vcard{border:1px solid var(--line);border-radius:7px;padding:6px 7px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.vcard.cur{border-color:var(--accent);background:var(--accent-soft)} .vcard.sel{box-shadow:0 0 0 1px var(--accent)}
.vcard .k{font-size:11px;color:var(--muted);min-width:62px} .vcard input[type=text]{flex:1;min-width:0}
.vcard input,.vcard select{border:1px solid var(--line);border-radius:5px;padding:2px 5px;background:var(--panel);font-size:12px}
.vcard input[type=number]{width:58px} .vcard label{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
.vcard .mono{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.stab.dirty .sgo{font-style:italic} .stab.dirty .sgo::after{content:" •";color:var(--accent)}
.supd{pointer-events:auto;flex:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2);white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vth{width:80px;height:50px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex:none;background:var(--sunk)} .vth[data-empty]{visibility:hidden}
.vtx{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0} .vtx input{width:100%}
.btn .ic{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round;vertical-align:-3px;margin-right:4px}
.btn .sh{display:none}
/* téléphone et tablette : cibles plus grandes, barre de vue en icônes, panneau des vues en bas d'écran */
@media (pointer:coarse){
  .tb{width:44px;height:44px} .stab button{padding:7px 11px} .stab.sadd{padding:7px 11px} .supd{padding:7px 12px}
  .viewbar .btn,#vSel{padding:6px 9px} .btn.sm{padding:6px 10px} .vcard input,.vcard select{padding:5px 6px;font-size:14px}
}
@media (max-width:760px){
  .viewbar .btn .lg{display:none} .viewbar .btn .sh{display:inline} .viewbar .btn .ic{margin-right:0} #vSel{max-width:150px}
  .viewbar{flex-wrap:nowrap}
  .info{font-size:11px;padding:4px 7px;max-width:calc(100% - 16px)} .info .unit{display:none}
  .vpanel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:68%;border-radius:12px 12px 0 0;border-bottom:0}
  .vpanel #vplan{width:min(100%,220px);align-self:center}
}
.stab.sadd.on{background:var(--accent-soft);border-color:var(--accent);border-style:solid;color:var(--ink)}
.viewbar{position:absolute;top:8px;right:8px;z-index:2;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 16px)}
.viewbar .btn{box-shadow:0 1px 3px rgba(0,0,0,.15);font-size:12px;padding:3px 8px}
.info{position:absolute;left:8px;bottom:8px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12px;max-width:min(380px,calc(100% - 16px));pointer-events:none}
.info .unit{color:var(--muted);font-size:11px;margin-top:2px} .info b{font-weight:600} .info .mono{font-family:var(--f-mono);font-size:11.5px}
#snapMk{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;pointer-events:none;border:2px solid #2E8B3A;border-radius:50%;background:rgba(255,255,255,.6)}
#snapMk.mid{border-color:#1C8FB0} #snapMk.edge{border-color:#C0392B;border-radius:2px} #snapMk.face{border-color:#2F5FD0;transform:rotate(45deg);border-radius:2px}
#snapMk.axis0{border-color:#D02020} #snapMk.axis1{border-color:#1E9A2E} #snapMk.axis2{border-color:#2040D0}
#selBox{position:absolute;pointer-events:none;border:1px solid #2F6FD0;background:rgba(47,111,208,.10)} #selBox.cross{border:1px dashed #2E8B3A;background:rgba(46,139,58,.10)}
#snapLb{position:absolute;pointer-events:none;font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap;color:var(--ink)}
.bar{display:flex;align-items:center;gap:10px;padding:5px 12px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
.hint{color:var(--muted);font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 260px}
.bar label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}
.bar input{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:3px 7px;font-family:var(--f-mono);font-size:12px}
#vcb{width:150px;text-align:right} #vcb.flash{border-color:var(--accent);background:var(--accent-soft)}
#segs{width:56px} #unit{padding:2px 4px;font-family:var(--f-mono);font-size:12px} #vSel{font-size:12px;padding:3px 6px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.help{position:absolute;top:44px;right:8px;width:min(400px,calc(100% - 16px));max-height:calc(100% - 56px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:10px 14px;font-size:12.5px}
.help h3{font-family:var(--f-cond);font-size:13px;letter-spacing:.05em;text-transform:uppercase;margin:8px 0 4px}
.help table{border-collapse:collapse;width:100%} .help td{padding:2px 4px;vertical-align:top;border-bottom:1px solid var(--line2)} .help td:first-child{white-space:nowrap;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
@media (max-width:760px){
  .work{flex-direction:column-reverse} .tools{flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:4px 6px} .tools .sep{width:1px;height:auto;margin:2px 4px}
  .tb kbd{display:none} .status{max-width:100%} .brand small{display:none} #vcb{width:120px}
}

/* 0.8 : menus déroulants, outils légendés, autres outils dans « Plus », navigation dans un pavé, accueil */
.ibtn{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:32px;height:30px;display:inline-grid;place-items:center;cursor:pointer;padding:0;color:var(--ink)}
.ibtn:hover{border-color:var(--muted)} .ibtn:disabled{opacity:.4;cursor:default} .ibtn.on{background:var(--accent-soft);border-color:var(--accent)}
.ibtn svg,.btn.ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.ico{display:inline-flex;align-items:center;gap:6px}
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 4px);left:0;z-index:60;min-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:4px;display:flex;flex-direction:column}
.menu.r{left:auto;right:0}
.menu button,.menu label{display:flex;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:5px;cursor:pointer;font-size:13px;color:var(--ink);white-space:nowrap;box-shadow:none}
.menu button:hover,.menu label:hover{background:var(--sel)}
.menu button .k{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-left:16px}
.menu button.on::after{content:'✓';margin-left:auto;color:var(--accent)}
.menu hr{border:0;border-top:1px solid var(--line2);margin:4px 6px}
.menu .mh{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 10px 2px;font-weight:600}
.menu input[type=checkbox]{accent-color:var(--accent)}
.menu.more{left:calc(100% + 6px);top:auto;bottom:0} .menu.more svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.menu .mt kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-left:16px}
.menu .mt.on{background:var(--accent-soft)}
.tools{overflow:visible}
.tools .tb{width:58px;height:52px;flex-direction:column;gap:2px;display:flex;align-items:center;justify-content:center}
.tools .tb .lb{font-size:10.5px;line-height:1.1;color:var(--muted);text-align:center}
.tools .tb.on .lb{color:var(--ink);font-weight:600}
.tools.nokeys kbd{display:none}
.navpad{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px;z-index:2}
.navpad .ibtn{width:36px;height:36px;box-shadow:0 1px 3px rgba(0,0,0,.15)} .navpad .ibtn svg{width:20px;height:20px}
.info{margin-right:56px}
#home{position:absolute;inset:0;z-index:40;background:var(--bg);overflow:auto}
#projName{font-weight:600;font-size:13px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){ .tools .tb{width:44px;height:44px} .tools .tb .lb{display:none} .menu.more{left:auto;right:0;bottom:calc(100% + 6px)} .tools{overflow-x:auto} .btn.ico .lg{display:none} #projName{display:none} }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="btn" id="bMenus" hidden title="Afficher les menus de TerraSuite" aria-label="Afficher les menus de TerraSuite">☰</button>
    <a class="btn" href="../terrasuite.html" id="homeLink">← TerraSuite</a>
    <div class="brand">TerraModel <span class="ver" id="ver"></span><small>Maquette 3D</small></div>
    <button class="btn ico" id="bHome" title="Accueil de TerraModel : maquettes et projets"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span class="lg">Accueil</span></button>
    <span id="projName" title="Maquette ouverte"></span>
    <div class="dd" id="gFile">
      <button class="btn" id="bFile" aria-haspopup="true">Fichier ▾</button>
      <div class="menu" id="mFile" hidden>
        <button id="bNew">Nouvelle maquette (vide)</button>
        <button id="bOpen">Ouvrir un fichier…<span class="k">.json</span></button>
        <button id="bImp">Importer…<span class="k">DXF, OBJ, DAE, glTF</span></button>
        <button id="bSave">Enregistrer une copie<span class="k">Ctrl+S</span></button>
        <hr>
        <button id="bObj">Exporter en OBJ<span class="k">Blender, SketchUp…</span></button>
        <button id="bDxf">Exporter en DXF 2D<span class="k">plan, coupe, élévation</span></button>
        <button id="bImgM">Image de la vue (PNG)…</button>
      </div>
    </div>

<script>
/* ================= TerraModel : noyau géométrique =================
   Modèle : sommets partagés M.v[id] = [x, y, z] (mètres, Z vers le haut),
   faces planes M.f[id] = { o: [ids] contour extérieur, h: [[ids]] trous },
   le contour extérieur tourne dans le sens direct autour de la normale de la face (les trous en sens inverse),
   traits libres M.l[id] = [a, b].
   Règles d'usage type SketchUp :
   - une forme tracée dans une face s'y imprime (la face reçoit un trou, la forme devient une face) ;
   - un trait d'un bord à l'autre d'une face la divise en deux ;
   - pousser/tirer : une face posée seule donne un volume ; une face prise dans un volume donne une excroissance (vers l'extérieur)
     ou un creux (vers l'intérieur), et un percement quand le creux atteint la face opposée ;
   - deux faces confondues de sens opposés s'annulent (percement, volumes accolés qui fusionnent),
     deux faces coplanaires de même sens créées par une extrusion fusionnent (pas d'arête inutile). */
const TOL = 1e-5;
const vsub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], vadd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const vmul = (a, s) => [a[0] * s, a[1] * s, a[2] * s], vdot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vlen = a => Math.hypot(a[0], a[1], a[2]), vnorm = a => { const l = vlen(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const vdist = (a, b) => vlen(vsub(a, b));

function newModel() { return { v: {}, f: {}, l: {}, n: 1 }; }
const cloneModel = M => JSON.parse(JSON.stringify(M));
function addV(M, p) { for (const k in M.v) if (vdist(M.v[k], p) < TOL) return +k; const id = M.n++; M.v[id] = [p[0], p[1], p[2]]; return id; }
function addF(M, f) { const id = M.n++; M.f[id] = { o: f.o.slice(), h: (f.h || []).map(x => x.slice()) }; if (f.m) M.f[id].m = f.m; return id; }
const loopsOf = f => [f.o, ...f.h];
const revF = f => { const r = { o: f.o.slice().reverse(), h: f.h.map(x => x.slice().reverse()) }; if (f.m) r.m = f.m; return r; };
const ekey = (a, b) => a < b ? a + '|' + b : b + '|' + a;

function newell(M, L) {
  const n = [0, 0, 0];
  for (let i = 0; i < L.length; i++) { const a = M.v[L[i]], b = M.v[L[(i + 1) % L.length]]; n[0] += (a[1] - b[1]) * (a[2] + b[2]); n[1] += (a[2] - b[2]) * (a[0] + b[0]); n[2] += (a[0] - b[0]) * (a[1] + b[1]); }
  return n;
}
const faceN = (M, f) => vnorm(newell(M, f.o));
const faceArea = (M, f) => (vlen(newell(M, f.o)) - f.h.reduce((s, h) => s + vlen(newell(M, h)), 0)) / 2;
/* repère du plan : u horizontal si possible (X pour un plan horizontal), v = n × u */
function basis(n) {
  let u; if (Math.abs(n[2]) > 0.9) u = vnorm(vsub([1, 0, 0], vmul(n, n[0]))); else u = vnorm(vcross([0, 0, 1], n));
  return { u, v: vcross(n, u) };
}
function frame(M, f) { const n = faceN(M, f), b = basis(n); return { o: M.v[f.o[0]], n, u: b.u, v: b.v }; }
const to2 = (fr, p) => { const d = vsub(p, fr.o); return [vdot(d, fr.u), vdot(d, fr.v)]; };
function pip(p, r) { let c = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++) { const a = r[i], b = r[j]; if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) c = !c; } return c; }
function dseg2(p, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy; let t = L ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy); }
/* position d'un point du plan par rapport à une région (contour + trous) : 'in', 'on' (sur un bord), 'out' */
function classify2(p, loops2, tol = 1e-6) {
  for (const r of loops2) for (let i = 0; i < r.length; i++) if (dseg2(p, r[i], r[(i + 1) % r.length]) < tol) return 'on';
  return pip(p, loops2[0]) && !loops2.slice(1).some(h => pip(p, h)) ? 'in' : 'out';
}
const loops2Of = (M, f, fr) => loopsOf(f).map(L => L.map(id => to2(fr, M.v[id])));
function classifyPoint(M, f, p, tol) { const fr = frame(M, f); return classify2(to2(fr, p), loops2Of(M, f, fr), tol); }
function coplanar(M, A, B) {
  const nA = faceN(M, A), nB = faceN(M, B), c = vdot(nA, nB); if (Math.abs(c) < 1 - 1e-6) return 0;
  if (Math.abs(vdot(nB, vsub(M.v[A.o[0]], M.v[B.o[0]]))) > TOL) return 0;
  for (const id of A.o) if (Math.abs(vdot(nB, vsub(M.v[id], M.v[B.o[0]]))) > TOL * 10) return 0;
  return c > 0 ? 1 : -1;
}
/* A (coplanaire) est-elle entièrement dans B ? */
function contained(M, A, B) {
  const fr = frame(M, B), L2 = loops2Of(M, B, fr), nA = faceN(M, A), e = 1e-4;
  for (const L of loopsOf(A)) for (let i = 0; i < L.length; i++) {
    const a = M.v[L[i]], b = M.v[L[(i + 1) % L.length]];
    if (classify2(to2(fr, a), L2) === 'out' || classify2(to2(fr, vmul(vadd(a, b), .5)), L2) === 'out') return false;
  }
  for (let i = 0; i < A.o.length; i++) { // à l'intérieur de A, juste à gauche de chaque côté
    const a = M.v[A.o[i]], b = M.v[A.o[(i + 1) % A.o.length]], q = vadd(vmul(vadd(a, b), .5), vmul(vnorm(vcross(nA, vsub(b, a))), e));
    if (classify2(to2(fr, q), L2, 1e-7) !== 'in') return false;
  }
  if (B.h.length) { // A ne doit pas recouvrir un trou de B
    const fa = frame(M, A), LA = loops2Of(M, A, fa), nB = fr.n;
    for (const H of B.h) { const a = M.v[H[0]], b = M.v[H[1]], q = vadd(vmul(vadd(a, b), .5), vmul(vnorm(vcross(vsub(b, a), nB)), e)); if (classify2(to2(fa, q), LA, 1e-7) === 'in') return false; }
  }
  return faceArea(M, A) <= faceArea(M, B) + 1e-9;
}
/* réunion des arêtes orientées de plusieurs faces coplanaires ; les arêtes parcourues dans les deux sens s'annulent ;
   les boucles restantes sont rangées en contours (sens direct autour de nRef) et en trous */
function combine(M, faces, nRef) {
  const cnt = new Map(), K = (a, b) => a + '>' + b;
  for (const f of faces) for (const L of loopsOf(f)) for (let i = 0; i < L.length; i++) {
    const a = L[i], b = L[(i + 1) % L.length], r = K(b, a);
    if (cnt.get(r) > 0) cnt.set(r, cnt.get(r) - 1); else cnt.set(K(a, b), (cnt.get(K(a, b)) || 0) + 1);
  }
  const E = []; for (const [k, c] of cnt) for (let i = 0; i < c; i++) { const [a, b] = k.split('>').map(Number); E.push([a, b]); }
  const out = new Map(); E.forEach((e, i) => { if (!out.has(e[0])) out.set(e[0], []); out.get(e[0]).push(i); });
  const b0 = basis(nRef), P2 = id => { const p = M.v[id]; return [vdot(p, b0.u), vdot(p, b0.v)]; };
  const used = new Set(), loops = [];
  for (let s = 0; s < E.length; s++) {
    if (used.has(s)) continue; const L = [], start = E[s][0]; let cur = s, ok = false;
    for (let guard = 0; guard < E.length + 2; guard++) {
      used.add(cur); const [a, b] = E[cur]; L.push(a);
      if (b === start) { ok = true; break; }
      const cand = (out.get(b) || []).filter(i => !used.has(i)); if (!cand.length) break;
      if (cand.length === 1) { cur = cand[0]; continue; }
      const pa = P2(a), pb = P2(b), din = [pb[0] - pa[0], pb[1] - pa[1]]; let best = cand[0], ba = -Infinity;
      for (const c of cand) { const pc = P2(E[c][1]), dout = [pc[0] - pb[0], pc[1] - pb[1]], ang = Math.atan2(din[0] * dout[1] - din[1] * dout[0], din[0] * dout[0] + din[1] * dout[1]); if (ang > ba) { ba = ang; best = c; } }
      cur = best;
    }
    if (ok && L.length >= 3) loops.push(L);
