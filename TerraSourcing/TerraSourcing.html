<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TerraSourcing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* TerraSourcing : veille des appels d'offres publics (BOAMP). Filtres à gauche, liste au centre, fiche à droite. Même famille visuelle que les autres applications, accent sarcelle. */
:root{
  --bg:#EDF0EF; --panel:#FFFFFF; --sunk:#F4F7F6; --ink:#1B2423; --muted:#5D6A68; --line:#D2DBD9; --line2:#E4EAE8;
  --accent:#0F766E; --accent-ink:#FFFFFF; --accent-soft:#D5EEEB; --sel:#E2F3F0;
  --warn:#9A5B00; --warn-bg:#FFF4DF; --err:#B3261E; --err-bg:#FCE8E6; --ok:#2E6B3F; --ok-bg:#E3F2E7; --info:#24546E;
  --f-ui:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-cond:"IBM Plex Sans Condensed","Arial Narrow","IBM Plex Sans",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121817; --panel:#1A2120; --sunk:#161C1B; --ink:#E1E9E7; --muted:#95A4A1; --line:#303B39; --line2:#26302E;
  --accent:#5FC4B8; --accent-ink:#0B1A18; --accent-soft:#1C3A36; --sel:#1C302D;
  --warn:#E2B15A; --warn-bg:#2E2512; --err:#F08A80; --err-bg:#3A1C1A; --ok:#7CC48F; --ok-bg:#1B3022; --info:#7DB4CF; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121817; --panel:#1A2120; --sunk:#161C1B; --ink:#E1E9E7; --muted:#95A4A1; --line:#303B39; --line2:#26302E;
  --accent:#5FC4B8; --accent-ink:#0B1A18; --accent-soft:#1C3A36; --sel:#1C302D;
  --warn:#E2B15A; --warn-bg:#2E2512; --err:#F08A80; --err-bg:#3A1C1A; --ok:#7CC48F; --ok-bg:#1B3022; --info:#7DB4CF; color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%;min-height:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-cond);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand small{font-family:var(--f-ui);font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);font-size:12px}
.ver{font-family:var(--f-mono);font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 7px;letter-spacing:0;text-transform:none;font-weight:400}
.tabs{display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:2px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;padding:5px 12px;border-radius:5px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tabs .n{font-family:var(--f-mono);font-size:11px;margin-left:4px;color:var(--muted)}
.tabs .n.new{color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:0 6px}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap;line-height:1.3;color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.sm{padding:2px 7px;font-size:12px}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 8px;min-width:0}
textarea{width:100%;resize:vertical;min-height:60px}
.status{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px}
.status.ok{color:var(--ok)} .status.err{color:var(--err)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.hint{font-size:11.5px;color:var(--muted);margin:0}
.mono{font-family:var(--f-mono);font-size:12px}
h2,h3,h4{margin:0}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}

/* recherche : filtres | résultats | fiche */
.three{flex:1;min-height:0;display:grid;grid-template-columns:290px minmax(0,1fr) minmax(380px,40%)}
.filters{border-right:1px solid var(--line);background:var(--sunk);overflow:auto;padding:12px 14px 30px;display:flex;flex-direction:column;gap:12px}
.fgroup{display:flex;flex-direction:column;gap:5px}
.fgroup>.lbl{display:flex;justify-content:space-between;align-items:center}
.checks{display:flex;flex-direction:column;gap:2px}
.checks label,.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--accent-soft);border-radius:999px;padding:1px 4px 1px 9px;font-size:12px}
.chip button{border:0;background:transparent;cursor:pointer;font-size:14px;line-height:1;padding:0 4px;color:inherit}
.presets{display:flex;flex-wrap:wrap;gap:4px}
.ac{position:relative}
.acl{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 2px);background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:260px;overflow:auto}
.acl button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:5px 9px;cursor:pointer;font-size:12.5px}
.acl button:hover,.acl button.on{background:var(--sel)}
.acl small{color:var(--muted);font-family:var(--f-mono)}
.results{overflow:auto;background:var(--panel);min-height:0;display:flex;flex-direction:column}
.rbar{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.rlist{display:flex;flex-direction:column}
.rec{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;padding:9px 14px;border-bottom:1px solid var(--line2);cursor:pointer;align-items:start}
.rec:hover{background:var(--sunk)}
.rec.sel{background:var(--sel)}
.rec .t{font-weight:500;line-height:1.35}
.rec.seen .t{font-weight:400;color:var(--muted)}
.rec .m{grid-column:2/4;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 10px}
.rec .d{text-align:right;font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.star{border:0;background:transparent;cursor:pointer;font-size:16px;line-height:1;padding:0;color:var(--muted)}
.star.on{color:var(--accent)}
.star.refuse{font-size:13px;margin-top:4px}
.star.refuse:hover{color:var(--err)}
.tag{display:inline-block;padding:0 7px;border-radius:9px;font-size:11px;font-weight:500;white-space:nowrap;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.tag.acc{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.tag.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.tag.err{background:var(--err-bg);border-color:transparent;color:var(--err)}
.tag.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.dl.urg{color:var(--err);font-weight:600}
.dl.soon{color:var(--warn);font-weight:600}
.dl.past{color:var(--muted);text-decoration:line-through}
.newdot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;margin-top:5px}
.more{padding:12px 14px;text-align:center}
.empty{margin:auto;max-width:460px;text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty b{color:var(--ink);font-size:15px}
.detail{border-left:1px solid var(--line);background:var(--sunk);overflow:auto;min-height:0;padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-family:var(--f-cond);font-weight:600;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.dtitle{font-family:var(--f-cond);font-weight:600;font-size:18px;line-height:1.25;text-wrap:balance}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 10px;font-size:12.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:6px}
.flags{display:flex;flex-wrap:wrap;gap:4px}
.txt{white-space:pre-wrap;font-size:12.5px;max-height:260px;overflow:auto;background:var(--sunk);border-radius:6px;padding:8px 10px}
details summary{cursor:pointer;color:var(--muted);font-size:12px}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.t th{position:sticky;top:0;z-index:2;background:var(--panel);text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.t tr.row{cursor:pointer}
.t tr.row:hover td{background:var(--sunk)}
.t tr.sel td{background:var(--sel)}
.t .num{text-align:right;font-family:var(--f-mono);font-size:12px;white-space:nowrap}

/* suivi */
.two{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,42%)}
.stbar{display:flex;flex-wrap:wrap;gap:4px}
.stbar button .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>label{font-size:11.5px;color:var(--muted)}
.go{display:flex;flex-direction:column;gap:4px}
.go label{display:flex;gap:7px;align-items:flex-start;font-size:12.5px}
.pane{overflow:auto;padding:18px 16px 40px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;max-width:1300px}
.menu{position:absolute;top:calc(100% + 4px);right:0;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px;width:300px;display:flex;flex-direction:column}
.menu button{border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:5px;cursor:pointer}
.menu button:hover{background:var(--sel)}
.menu button span{display:block;font-size:11.5px;color:var(--muted)}
.wrap{position:relative}
@media (max-width:1100px){
  .three{grid-template-columns:250px minmax(0,1fr)}
  .three .detail{grid-column:1/3;border-left:0;border-top:1px solid var(--line)}
  .two{grid-template-columns:1fr}
}
@media (max-width:720px){
  #app{height:auto;min-height:100%}
  .view{flex:none}
  .three{grid-template-columns:1fr}
  .three .detail{grid-column:auto}
  .filters{border-right:0;border-bottom:1px solid var(--line)}
  .kv{grid-template-columns:110px minmax(0,1fr)}
  .brand small{display:none}
}
@media print{
  .top,.filters,.rbar,.star,.noprint{display:none!important}
  body,#app{height:auto;background:#fff}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <a class="btn" href="../terrasuite.html" id="homeLink">← TerraSuite</a>
    <div class="brand">TerraSourcing <span class="ver" id="ver" title="Version bêta"></span><small>Appels d'offres publics</small></div>
    <nav class="tabs" role="tablist" aria-label="Vues">
      <button role="tab" data-tab="home" aria-selected="true">Accueil</button>
      <button role="tab" data-tab="search" aria-selected="false">Recherche</button>
      <button role="tab" data-tab="veille" aria-selected="false">Veilles<span class="n" id="nVeille"></span></button>
      <button role="tab" data-tab="suivi" aria-selected="false">Suivi des réponses<span class="n" id="nSuivi"></span></button>
      <button role="tab" data-tab="refus" aria-selected="false">Refusés<span class="n" id="nRefus"></span></button>
      <button role="tab" data-tab="attrib" aria-selected="false">Attributions</button>
    </nav>
    <span class="grow"></span>
    <div class="wrap"><button class="btn" id="bSave" aria-haspopup="true">Sauvegarde ▾</button>
      <div class="menu" id="saveMenu" hidden role="menu">
        <button data-act="xlsx" role="menuitem"><b>Suivi des réponses</b> (.xlsx)<span>Un tableau par ligne de suivi, pour Excel</span></button>
        <button data-act="csv" role="menuitem"><b>Résultats affichés</b> (.csv)<span>La liste de la recherche en cours</span></button>
        <button data-act="backup" role="menuitem"><b>Exporter tout</b> (.json)<span>Veilles, suivi, refusés, avis vus</span></button>
        <button data-act="restore" role="menuitem"><b>Restaurer une sauvegarde</b><span>Ajoute ou remplace les éléments de même identifiant</span></button>
      </div></div>
    <span class="status" id="status" role="status"></span>
  </header>
  <main class="view" id="view"></main>
  <input type="file" id="jsonIn" accept=".json,application/json" hidden>
</div>
<!-- avis des plateformes (AWS…), fichier déposé par la collecte quotidienne ; absent : seul le BOAMP est interrogé -->
<script src="TerraSourcing-plateformes.js"></script>
<script src="../TerraChantier/ts-undo.js" onerror="this.remove()"></script>
<script>
/* ================= TerraSourcing : noyau ================= */
const APP_VERSION = '0.4.1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const NF0 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
function setStatus(t, cls) { const el = $('#status'); if (!el) return; el.textContent = t || ''; el.className = 'status' + (cls ? ' ' + cls : ''); }
const pad = n => String(n).padStart(2, '0');
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoDay(new Date());
const addDays = (n, d = new Date()) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtDay = s => { if (!s) return ''; const [y, m, d] = s.slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
const fmtDayShort = s => { if (!s) return ''; const [y, m, d] = s.slice(0, 10).split('-'); return `${d}/${m}`; };
/* date limite « AAAA-MM-JJTHH:MM » (heure de Paris), lue sans tenir compte du fuseau indiqué : le BOAMP marque +00:00 des heures locales */
const dlDate = s => s ? new Date(s.slice(0, 10) + 'T' + (s.slice(11, 16) || '23:59')) : null;
function fmtDl(s) { if (!s) return ''; const t = s.slice(11, 16); return fmtDay(s) + (t && t !== '00:00' ? ' ' + t.replace(':', 'h') : ''); }
function daysLeft(s) { const d = dlDate(s); if (!d) return null; return Math.ceil((d - new Date()) / 864e5); }
function dlClass(s) { const n = daysLeft(s); if (n === null) return ''; return n < 0 ? 'past' : n <= 5 ? 'urg' : n <= 12 ? 'soon' : ''; }
function dlLabel(s) { const n = daysLeft(s); if (n === null) return ''; return n < 0 ? 'clos' : n === 0 ? "aujourd'hui" : 'J-' + n; }
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/œ/g, 'oe');

/* ---------- stockage navigateur ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('ts-' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  /* veilles, dossiers suivis et refus : annulables (ts-undo.js) ; l'état d'avant est celui resté dans le navigateur */
  set(k, v) { try { const a = JSON.stringify(v), U = { suivi: 'suivi', profiles: 'veille', refus: 'refus' }[k];
    if (U && typeof TSUndo !== 'undefined') TSUndo.record([{ s: 'ls', id: k, before: localStorage.getItem('ts-' + k), after: a }], U);
    localStorage.setItem('ts-' + k, a); return true; } catch (e) { setStatus('Enregistrement impossible dans ce navigateur : ' + e.message, 'err'); return false; } }
};

/* ---------- API BOAMP (DILA, Opendatasoft) ---------- */
const BOAMP = 'https://boamp-datadila.opendatasoft.com/api/explore/v2.1/catalog/datasets/boamp';
async function getJSON(url, timeout = 30000) {
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), timeout);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.message || 'HTTP ' + r.status);
    return j;
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'délai dépassé' : e.message === 'Failed to fetch' ? 'BOAMP injoignable (connexion internet ?)' : e.message); }
  finally { clearTimeout(tm); }
}
const qs = s => '"' + String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
const inList = (field, vals) => `${field} IN (${vals.map(qs).join(',')})`;

/* ---------- référentiels ---------- */
const DESC_DEFAULT = ["Maîtrise d'oeuvre", 'Etude', 'Ingénierie', "Assistance à maîtrise d'ouvrage", 'Bâtiment', 'Urbanisme', 'Architecture', 'Prestations intellectuelles', 'Programmation', 'Paysage', 'Diagnostic', 'Economiste', 'Ordonnancement pilotage et coordination', 'Contrôle technique', 'Coordination sécurité et protection de la santé'];
const PROC = [['OUVERT', 'Ouverte (AO)'], ['RESTREINT', 'Restreinte'], ['NEGOCIE', 'Négociée'], ['PROCEDURE_ADAPTE', 'Adaptée (MAPA)'], ['DIALOGUE_COMPETITIF', 'Dialogue compétitif'], ['AUTRE', 'Autre (dont concours)']];

/* ================= TerraSourcing : interface ================= */
const st = {
  tab: 'home', f: Object.assign(clone(FILTER_DEFAULT), LS.get('filters', {})), res: [], total: 0, offset: 0, loading: false, err: '', sel: null,
  profiles: LS.get('profiles', []), suivi: LS.get('suivi', {}), seen: LS.get('seen', {}), descOpts: LS.get('desc-opts', null),
  newCounts: {}, suiviSel: null, suiviFilter: 'actifs', attr: { f: { kw: '', tit: '', days: 365 }, res: [], total: 0, facets: null, sel: null, loading: false },
  plat: null, srcFilter: LS.get('srcFilter', 'tout'), refus: LS.get('refus', {}), refusSel: null
};
const saveF = () => LS.set('filters', st.f);
const saveSuivi = () => { LS.set('suivi', st.suivi); badges(); };
const saveProfiles = () => { LS.set('profiles', st.profiles); badges(); };
const saveRefus = () => { LS.set('refus', st.refus); badges(); };
const MOTIFS = ['', 'Hors périmètre (programme)', 'Zone géographique', 'Montant trop faible ou trop élevé', 'Délai trop court', 'Architecte non requis', 'Références insuffisantes', 'Charge de l\'agence', 'Autre'];
/* « pas intéressé » : l'avis quitte la liste principale et rejoint l'onglet Refusés */
function refuse(o) {
  if (!o) return;
  if (st.suivi[o.idweb]) { if (!confirm('Cet avis est dans le suivi des réponses. Le retirer du suivi et le classer dans les refusés ?')) return; delete st.suivi[o.idweb]; saveSuivi(); }
  st.refus[o.idweb] = { ...snapshot(o), refuseLe: Date.now(), motif: '', note: '' }; saveRefus();
  if (st.sel && st.sel.idweb === o.idweb) st.sel = null;
  setStatus('Classé dans les refusés', 'ok');
}
function unrefuse(id) { delete st.refus[id]; saveRefus(); setStatus('Avis rétabli dans la liste', 'ok'); }
function markSeen(id) { if (st.seen[id]) return; st.seen[id] = Date.now(); const ks = Object.keys(st.seen); if (ks.length > 6000) ks.sort((a, b) => st.seen[a] - st.seen[b]).slice(0, 1500).forEach(k => delete st.seen[k]); LS.set('seen', st.seen); }

/* ---------- données des plateformes (fichier TerraSourcing-plateformes.js déposé par la collecte quotidienne) ---------- */
function loadPlat() {
  const D = window.TS_PLATEFORMES; if (!D || !Array.isArray(D.avis)) { st.plat = null; return; }
  st.plat = { at: D.at || '', sources: D.sources || {}, avis: D.avis.map(platRec) };
}
function platRec(a) {
  const o = { _plat: true, source: a.source || 'Plateforme', idweb: a.id, objet: a.objet || '', acheteur: a.acheteur || '', depts: a.depts || [], famille: '', familleL: a.source, nature: 'Avis de marché', procedure: a.procedure || '', typeProc: '', parution: a.parution || '', url: a.url || '', desc: [], typeMarche: [], etat: '', dlQuestions: '', titulaires: [], lie: [], dl: a.dl || '', dlKind: 'offres', dlOffres: a.dl || '', dlCand: '', links: (a.links || []).filter(x => x && x[1]), montant: null, duree: '', lieu: a.lieu || '', ville: '', description: a.texte || '', lots: [], criteres: [], conditions: [], cpv: [], idm: a.idm || '', boamp: a.boamp || '' };
  o.text = norm([o.objet, o.acheteur, o.description, o.lieu].join(' '));
  o.flags = flagsOf(o, {});
  return o;
}
/* un avis de plateforme déjà publié au BOAMP n'est montré qu'une fois (version BOAMP, plus complète) : recherche du numéro de consultation dans le BOAMP, mémorisée */
async function platBoampCheck() {
  if (!st.plat) return;
  const cache = LS.get('plat-boamp', {}), todo = st.plat.avis.filter(o => o.idm && !(o.idweb in cache));
  st.plat.avis.forEach(o => { if (cache[o.idweb]) o.boamp = cache[o.idweb]; });
  let i = 0, changed = false;
  const worker = async () => { while (i < todo.length) { const o = todo[i++]; try { const j = await getJSON(`${BOAMP}/records?limit=1&select=idweb&where=${encodeURIComponent(`search(${qs(o.idm)})`)}`, 15000); const id = (j.results && j.results[0] && j.results[0].idweb) || ''; cache[o.idweb] = id; if (id) { o.boamp = id; changed = true; } } catch (e) { break; } } };
  await Promise.all([worker(), worker(), worker(), worker()]);
  const keep = new Set(st.plat.avis.map(o => o.idweb)); for (const k in cache) if (!keep.has(k)) delete cache[k];
  LS.set('plat-boamp', cache);
  if (changed && st.tab === 'search' && st.srcFilter !== 'plat') search();
}
const DESC_RX = { "Maîtrise d'oeuvre": /maitrise d.?oeuvre|\bmoe\b|architect|concours/, 'Etude': /etude|diagnostic/, "Assistance à maîtrise d'ouvrage": /assistance a maitrise d.?ouvrage|\bamo\b|programmation/, 'Ingénierie': /ingenierie|bureau d.?etudes/, 'Bâtiment': /batiment|construction|rehabilitation|renovation/, 'Urbanisme': /urbanis/, 'Paysage': /paysag/ };
/* filtre appliqué aux avis des plateformes, comme la requête BOAMP */
function platMatch(o, f) {
  const kw = splitTerms(f.kw).map(norm), ex = splitTerms(f.excl).map(norm);
  if (kw.length && !kw.some(k => o.text.includes(k))) return false;
  if (ex.some(k => o.text.includes(k))) return false;
  if (f.depts && f.depts.length && o.depts.length && !o.depts.some(d => f.depts.includes(d))) return false;
  if ((f.concours || f.ac || f.cr) && !((f.concours && /concours/.test(o.text)) || (f.ac && /accord[- ]cadre/.test(o.text)) || (f.cr && /conception[- ]realisation/.test(o.text)))) return false;
  if (f.open && o.dl && daysLeft(o.dl) < 0) return false;
  if (+f.days && o.parution && o.parution < isoDay(addDays(-f.days))) return false;
  // domaine : les avis des plateformes n'ont pas de descripteur, on cherche les mots du domaine dans l'objet
  if (f.desc && f.desc.length && !f.desc.some(d => (DESC_RX[d] || new RegExp(norm(d).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))).test(o.text))) return false;
  return true;
}

function autoc(inp, list, find, pick) {
  let items = [], on = 0;
  const show = () => { items = inp.value.trim() ? find(inp.value.trim()) : []; on = 0; list.hidden = !items.length; list.innerHTML = items.map((it, i) => `<button type="button" data-i="${i}" class="${i === on ? 'on' : ''}">${esc(it.l)}</button>`).join(''); list.querySelectorAll('button').forEach(b => b.onmousedown = e => { e.preventDefault(); pick(items[+b.dataset.i]); }); };
  inp.addEventListener('input', show);
  inp.addEventListener('keydown', e => { if (list.hidden) return; if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); on = (on + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; list.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === on)); } if (e.key === 'Enter' && items[on]) { e.preventDefault(); pick(items[on]); } if (e.key === 'Escape') list.hidden = true; });

}

function attrWhere() {
  const a = st.attr.f, f = { ...clone(FILTER_DEFAULT), desc: st.f.desc, depts: st.f.depts, kw: a.kw, days: a.days, open: false };
  let w = whereOf(f, { nat: ['Résultat de marché'], titulaire: a.tit || '' });
  if (a.buyer) w += ` AND nomacheteur=${qs(a.buyer)}`;
  return w;
}
async function attrSearch(more) {
  const A = st.attr; A.loading = true; if (!more) { A.res = []; A.total = 0; A.facets = null; } renderAttrib();
  try {
    const w = attrWhere();
    const [j, fc] = await Promise.all([boampRecords(w, { offset: A.res.length }), more ? Promise.resolve(A.facets) : boampFacets(['titulaire', 'nomacheteur'], w).catch(() => null)]);
    A.res = [...A.res, ...(j.results || []).map(parseRec)]; A.total = j.total_count || 0; A.facets = fc; A.err = '';
  } catch (e) { A.err = e.message; }
  A.loading = false; renderAttrib();
}

/* ================= Sauvegardes et exports ================= */
function dl(name, data, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
const csvCell = v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function loadXLSX() { return window.XLSX ? Promise.resolve() : new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = () => ko(new Error('bibliothèque Excel injoignable')); document.head.appendChild(s); }); }
async function saveAct(act) {
  const stamp = today();
  if (act === 'backup') dl(`TerraSourcing ${stamp}.json`, JSON.stringify({ app: 'TerraSourcing', version: APP_VERSION, at: new Date().toISOString(), profiles: st.profiles, suivi: st.suivi, refus: st.refus, seen: st.seen, filters: st.f }, null, 1), 'application/json');
  if (act === 'restore') $('#jsonIn').click();
  if (act === 'csv') {
    const rows = [['Source', 'Référence', 'Objet', 'Acheteur', 'Départements', 'Procédure', 'Parution', 'Date limite', 'Repères', 'Lien avis', 'Lien DCE'], ...st.res.map(o => [o._plat ? o.source : 'BOAMP', o.idweb, o.objet, o.acheteur, o.depts.join(' '), o.procedure, fmtDay(o.parution), fmtDl(o.dl), o.flags.map(x => x[1]).join(', '), o.url, (o.links[0] || [])[1] || ''])];
    dl(`TerraSourcing recherche ${stamp}.csv`, '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\r\n'), 'text/csv');
  }
  if (act === 'xlsx') {
    try { setStatus('Préparation du fichier Excel…'); await loadXLSX(); } catch (e) { setStatus(e.message, 'err'); return; }
    const L = Object.values(st.suivi).sort((a, b) => (a.dl || '9999').localeCompare(b.dl || '9999'));
    const aoa = [['Dossier', 'Statut', 'Date limite', 'Type', 'Objet', 'Acheteur', 'Départements', 'Procédure', 'Visite', 'Visite : date, contact', 'Compétences', 'Pièces à rendre', 'Go/No-go', 'Date de dépôt', 'Montant offre € HT', 'Résultat', 'Notes', 'Source', 'Référence', 'Lien avis', 'Lien DCE'],
      ...L.map(s => [s.dossier, STATUT[s.statut].l, fmtDl(s.dl), s.dlKind || '', s.objet, s.acheteur, (s.depts || []).join(' '), s.procedure, s.visite, s.visiteDate, s.competences, s.pieces, ['archi', 'perim', 'refs', 'delai'].filter(k => (s.go || {})[k]).length + '/4', s.dateDepot, s.montantOffre, s.resultat, s.notes, s.source || 'BOAMP', s.idweb, s.url, ((s.links || [])[0] || [])[1] || ''])];
    const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = [8, 14, 16, 12, 60, 34, 10, 16, 12, 22, 40, 40, 9, 12, 14, 24, 40, 10, 12, 30, 30].map(w => ({ wch: w }));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Suivi'); XLSX.writeFile(wb, `TerraSourcing suivi ${stamp}.xlsx`); setStatus('Fichier Excel enregistré', 'ok');
  }
}
async function restore(file) {
  try {
    const o = JSON.parse(await file.text()); if (o.app !== 'TerraSourcing') throw new Error('ce fichier n\'est pas une sauvegarde TerraSourcing');
    const ids = new Set(st.profiles.map(p => p.id)); for (const p of o.profiles || []) { if (ids.has(p.id)) st.profiles = st.profiles.filter(x => x.id !== p.id); st.profiles.push(p); }
    Object.assign(st.suivi, o.suivi || {}); Object.assign(st.seen, o.seen || {}); Object.assign(st.refus, o.refus || {}); saveRefus();
    saveProfiles(); saveSuivi(); LS.set('seen', st.seen); setStatus(`Sauvegarde restaurée : ${(o.profiles || []).length} veille(s), ${Object.keys(o.suivi || {}).length} ligne(s) de suivi`, 'ok'); render(); refreshCounts();
  } catch (e) { setStatus('Restauration impossible : ' + e.message, 'err'); }
}

async function loadDescOpts() {
  const c = LS.get('desc-cache', null); if (c && Date.now() - c.at < 7 * 864e5) { st.descOpts = c.v; return; }

    const fc = await boampFacets(['descripteur_libelle'], `dateparution >= date'${isoDay(addDays(-365))}' AND (type_marche_facette="Services" OR descripteur_libelle IN ("Bâtiment","Maîtrise d'oeuvre"))`);

  $('#ver').textContent = 'v' + APP_VERSION + ' bêta';
  if (location.protocol !== 'file:') { const h = $('#homeLink'); if (h) h.remove(); }
  loadPlat();
  $$('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  $('#bSave').onclick = e => { e.stopPropagation(); const m = $('#saveMenu'); m.hidden = !m.hidden; };
  document.addEventListener('click', e => { if (!e.target.closest('#saveMenu')) $('#saveMenu').hidden = true; });
  $$('#saveMenu [data-act]').forEach(b => b.onclick = () => { $('#saveMenu').hidden = true; saveAct(b.dataset.act); });
  $('#jsonIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) restore(f); });
  if (typeof TSUndo !== 'undefined') { TSUndo.init(items => { for (const { id, value } of items) { st[id] = value ?? (id === 'profiles' ? [] : {}); LS.set(id, st[id]); } render(); }); TSUndo.buttons($('.top'), { cls: 'btn', before: $('#status') }); }
  render(); search(); loadDescOpts(); refreshCounts(); platBoampCheck();
}
window.TS = { st, parseRec, whereOf, search, platRec };
init();

</script>
